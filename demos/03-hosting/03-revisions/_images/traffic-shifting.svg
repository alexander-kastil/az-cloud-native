<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 880" width="1920" height="880" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Traffic shifting between two revisions of tracking-service</title>
<desc id="desc">Requests reach the ingress of tracking-service, a container app in multiple mode, and split between &lt;OLD_REVISION&gt; and &lt;NEW_REVISION&gt; at the traffic weights, which add up to 100. The weights move from 100 / 0 to 90 / 10, 50 / 50 and 0 / 100. At 0 the old revision stays active, kept for rollback.</desc>
<style>
.oE,.oO,.o5,.nE,.nO,.n5,.w1,.w2,.w3,.w4{animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:linear}
.up,.dn{animation-duration:1.6s;animation-iteration-count:infinite;animation-timing-function:linear}
.up{animation-name:up}
.dn{animation-name:dn}
.oE{animation-name:oE}
.oO{animation-name:oO}
.o5{animation-name:o5}
.nE{animation-name:nE}
.nO{animation-name:nO}
.n5{animation-name:n5}
.w1{animation-name:w1}
.w2{animation-name:w2}
.w3{animation-name:w3}
.w4{animation-name:w4}
@keyframes up{0%{transform:translate(0px,0px);opacity:0}6%,94%{opacity:1}100%{transform:translate(638px,-112px);opacity:0}}
@keyframes dn{0%{transform:translate(0px,0px);opacity:0}6%,94%{opacity:1}100%{transform:translate(638px,158px);opacity:0}}
@keyframes oE{0%,65.9%{opacity:1}66%,100%{opacity:0}}
@keyframes oO{0%,43.9%{opacity:1}44%,100%{opacity:0}}
@keyframes o5{0%,21.9%{opacity:1}22%,100%{opacity:0}}
@keyframes nE{0%,65.9%{opacity:0}66%,100%{opacity:1}}
@keyframes nO{0%,43.9%{opacity:0}44%,100%{opacity:1}}
@keyframes n5{0%,21.9%{opacity:0}22%,100%{opacity:1}}
@keyframes w1{0%,21.9%{opacity:1}22%,100%{opacity:0}}
@keyframes w2{0%,21.9%{opacity:0}22%,43.9%{opacity:1}44%,100%{opacity:0}}
@keyframes w3{0%,43.9%{opacity:0}44%,65.9%{opacity:1}66%,100%{opacity:0}}
@keyframes w4{0%,65.9%{opacity:0}66%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
