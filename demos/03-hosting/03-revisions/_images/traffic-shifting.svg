<text x="262" y="138" font-size="26" fill="#64748B">container app in multiple mode</text>

<text x="40" y="350" font-size="28" font-weight="700" fill="#0F172A">requests</text>
<line x1="40" y1="372" x2="286" y2="372" stroke="#334155" stroke-width="4" marker-end="url(#ah)"/>

<rect x="290" y="262" width="360" height="220" rx="16" fill="#F8FAFC" stroke="#334155" stroke-width="3"/>
<text x="470" y="352" font-size="32" font-weight="700" fill="#0F172A" text-anchor="middle">ingress</text>
