<g class="nE"><circle class="dn" style="animation-delay:-0.00s" cx="650" cy="372" r="11" transform="translate(31.9 7.9)"/></g>
<g class="nO"><circle class="dn" style="animation-delay:-0.16s" cx="650" cy="372" r="11" transform="translate(95.7 23.7)"/></g>
<g class="nE"><circle class="dn" style="animation-delay:-0.32s" cx="650" cy="372" r="11" transform="translate(159.5 39.5)"/></g>
<g class="nO"><circle class="dn" style="animation-delay:-0.48s" cx="650" cy="372" r="11" transform="translate(223.3 55.3)"/></g>
<g class="nE"><circle class="dn" style="animation-delay:-0.64s" cx="650" cy="372" r="11" transform="translate(287.1 71.1)"/></g>
<g class="n5"><circle class="dn" style="animation-delay:-0.80s" cx="650" cy="372" r="11" transform="translate(350.9 86.9)"/></g>
<g class="nE"><circle class="dn" style="animation-delay:-0.96s" cx="650" cy="372" r="11" transform="translate(414.7 102.7)"/></g>
<g class="nO"><circle class="dn" style="animation-delay:-1.12s" cx="650" cy="372" r="11" transform="translate(478.5 118.5)"/></g>
<g class="nE"><circle class="dn" style="animation-delay:-1.28s" cx="650" cy="372" r="11" transform="translate(542.3 134.3)"/></g>
<g class="nO"><circle class="dn" style="animation-delay:-1.44s" cx="650" cy="372" r="11" transform="translate(606.1 150.1)"/></g>
</g>

<text x="40" y="806" font-size="28" fill="#64748B">traffic weights, old / new</text>
<g fill="#FFFFFF" stroke="#94A3B8" stroke-width="2">
<rect x="470" y="760" width="300" height="72" rx="36"/>
<rect x="830" y="760" width="300" height="72" rx="36"/>
