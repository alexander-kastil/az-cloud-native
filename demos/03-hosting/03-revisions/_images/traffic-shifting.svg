<text x="1576" y="312" font-size="26" font-weight="600" fill="#6D28D9" text-anchor="middle">kept for rollback</text>
</g>

<g font-size="34" font-weight="700" fill="#0F172A" text-anchor="middle">
<text class="w1" opacity="0" x="969" y="290">100%</text>
<text class="w2" opacity="0" x="969" y="290">90%</text>
<text class="w3" opacity="0" x="969" y="290">50%</text>
<text class="w4" x="969" y="290">0%</text>
