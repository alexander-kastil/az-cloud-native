<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1100" width="1920" height="1100" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Rows from four tables joined into one transaction tree</title>
<desc id="desc">Four Log Analytics tables hold the rows of one parcel scan, and every row of that scan carries OperationId 4bf92f35. AppRequests holds POST /scans with Id a1f0 and ServiceBusProcessor.ProcessMessage with Id c7d2. AppDependencies holds Message with Id b3e4, ServiceBusSender.Send with Id d5f6 and Operation.UpsertItemAsync with Id f8a9. AppTraces holds the log messages Scan received and Projecting scan, and AppExceptions holds Microsoft.Azure.Cosmos.CosmosException. AppTraces and AppExceptions have no Id column, so their rows are leaves. Arrows link each ParentId to the Id of its parent row: Message, ServiceBusSender.Send and Scan received point to POST /scans, ServiceBusProcessor.ProcessMessage points to Message, and Operation.UpsertItemAsync, Projecting scan and the CosmosException point to ServiceBusProcessor.ProcessMessage. Two grey rows carry OperationId 9c27d1a0 from another scan and stay out of the tree. On the right, the same eight rows form the end-to-end transaction as a Gantt chart on a time axis from 0 to 400 ms.</desc>
