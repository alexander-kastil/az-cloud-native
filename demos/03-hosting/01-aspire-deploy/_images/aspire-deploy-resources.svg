<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" width="1920" height="1000" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">What aspire deploy creates and how the apps pull their images</title>
<desc id="desc">Your machine runs aspire deploy, builds the images with Docker Desktop or Podman and pushes them to Azure Container Registry. One resource group holds the registry, a user-assigned managed identity, Azure Files shares that back the volumes and bind mounts, and the Container Apps environment aca-env with the Aspire dashboard and a container app per compute resource, such as routing-service and shipping-api. The apps pull their images from the registry as the managed identity, which holds the image pull permission.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1000" fill="#F8FAFC"/>

<rect x="60" y="170" width="300" height="200" rx="14" fill="#0F172A" stroke="#334155" stroke-width="3"/>
<text x="210" y="282" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="middle">aspire deploy</text>
<path d="M30 370H390L370 402H50Z" fill="#CBD5E1" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
<text x="210" y="458" font-size="30" font-weight="700" fill="#0F172A" text-anchor="middle">your machine</text>
<g font-size="26" fill="#64748B" text-anchor="middle">
<text x="210" y="500">Docker Desktop or Podman</text>
<text x="210" y="534">builds the images</text>
</g>

<g font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">
<text x="440" y="254">push</text>
<text x="440" y="286">images</text>
</g>
<line x1="362" y1="306" x2="550" y2="306" stroke="#334155" stroke-width="4" marker-end="url(#ah)"/>

<rect x="520" y="40" width="1360" height="920" rx="24" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="14 10"/>
<text x="552" y="96" font-size="30" font-weight="700" fill="#0F172A">resource group</text>

<rect x="552" y="124" width="420" height="260" rx="16" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<text x="576" y="174" font-size="28" font-weight="700" fill="#0F172A">Azure Container Registry</text>
<g fill="#FFFFFF" stroke="#15803D" stroke-width="2">
<rect x="580" y="200" width="364" height="60" rx="10"/>
<rect x="580" y="276" width="364" height="60" rx="10"/>
</g>
<g font-size="26" font-weight="600" fill="#0F172A">
<text x="604" y="239">routing-service</text>
<text x="604" y="315">shipping-api</text>
</g>

<rect x="1036" y="124" width="400" height="260" rx="16" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
<g font-size="28" font-weight="700" fill="#0F172A">
<text x="1060" y="174">User-assigned</text>
<text x="1060" y="210">managed identity</text>
</g>
<text x="1060" y="256" font-size="26" fill="#64748B">assigned to the apps</text>
<rect x="1060" y="290" width="96" height="66" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3"/>
<circle cx="1088" cy="316" r="11" fill="#6D28D9"/>
<path d="M1072 344a16 13 0 0 1 32 0z" fill="#6D28D9"/>
<g stroke="#6D28D9" stroke-width="3" stroke-linecap="round">
<line x1="1116" y1="312" x2="1142" y2="312"/>
<line x1="1116" y1="330" x2="1136" y2="330"/>
</g>

<rect x="1500" y="124" width="348" height="260" rx="16" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<text x="1524" y="174" font-size="28" font-weight="700" fill="#0F172A">Azure Files shares</text>
<g font-size="26" fill="#64748B">
<text x="1524" y="220">back the volumes</text>
<text x="1524" y="254">and bind mounts</text>
</g>
<path d="M1524 296H1562L1574 308H1620V356H1524Z" fill="#FFFFFF" stroke="#15803D" stroke-width="3" stroke-linejoin="round"/>

<text x="742" y="522" font-size="28" font-weight="700" fill="#0F172A" text-anchor="end">pull image</text>
<path d="M1236 384V500H770" fill="none" stroke="#6D28D9" stroke-width="3" stroke-dasharray="10 8"/>
<text x="800" y="486" font-size="26" font-weight="600" fill="#6D28D9">image pull permission</text>

<rect x="552" y="568" width="1296" height="360" rx="20" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="4"/>
<text x="800" y="618" font-size="30" font-weight="700" fill="#0F172A">Container Apps environment</text>
<text x="1228" y="618" font-size="28" fill="#64748B">aca-env</text>

<rect x="584" y="640" width="700" height="256" rx="16" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="608" y="684" font-size="26" fill="#64748B">a container app per compute resource</text>
<g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3">
<rect x="608" y="706" width="316" height="166" rx="14"/>
<rect x="948" y="706" width="316" height="166" rx="14"/>
</g>
<g font-size="30" font-weight="700" fill="#0F172A" text-anchor="middle">
<text x="766" y="799">routing-service</text>
<text x="1106" y="799">shipping-api</text>
</g>

<rect x="1324" y="640" width="492" height="256" rx="16" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="1352" y="690" font-size="30" font-weight="700" fill="#0F172A">Aspire dashboard</text>
<text x="1352" y="730" font-size="26" fill="#64748B">included by default</text>
<g fill="#1D4ED8">
<rect x="1352" y="812" width="32" height="48" rx="4"/>
<rect x="1400" y="780" width="32" height="80" rx="4"/>
<rect x="1448" y="800" width="32" height="60" rx="4"/>
<rect x="1496" y="764" width="32" height="96" rx="4"/>
</g>

<line x1="762" y1="640" x2="762" y2="388" stroke="#334155" stroke-width="4" marker-end="url(#ah)"/>
<circle cx="762" cy="500" r="8" fill="#6D28D9"/>
</svg>
