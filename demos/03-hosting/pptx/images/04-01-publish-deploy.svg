<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="pd-title pd-desc">
<title id="pd-title">aspire publish and aspire deploy with the AKS target</title>
<desc id="pd-desc">Top lane: aspire publish -o ./k8s-output writes Helm charts you apply with helm or CI. The Helm chart lands in the output folder, aspire-output by default. You review the chart, because publish doesn't change the cluster, and then helm or a CI job applies the chart to the cluster. Bottom lane: aspire deploy with the AKS target provisions Azure resources and deploys in a single command. Bicep provisions the AKS cluster, and the command deploys the Helm charts to the AKS cluster.</desc>
<defs>
<marker id="pd-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#F8FAFC"/>

<g fill="#FFFFFF" stroke="#94A3B8" stroke-width="3" stroke-dasharray="14 10">
<rect x="40" y="40" width="1840" height="470" rx="24"/>
<rect x="40" y="570" width="1840" height="470" rx="24"/>
</g>

<g fill="#0F172A">
<rect x="80" y="80" width="520" height="68" rx="14"/>
<rect x="80" y="610" width="280" height="68" rx="14"/>
</g>
<g font-size="28" font-weight="700" font-family="Consolas, 'Courier New', monospace" fill="#FFFFFF">
<text x="104" y="124">aspire publish -o ./k8s-output</text>
<text x="104" y="654">aspire deploy</text>
</g>
<g font-size="26" fill="#64748B">
<text x="640" y="124">Helm charts you apply with helm or CI</text>
<text x="400" y="654">with the AKS target, provisions Azure resources and deploys in a single command</text>
</g>

<g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3">
<rect x="80" y="200" width="380" height="260" rx="14"/>
<rect x="560" y="200" width="380" height="260" rx="14"/>
<rect x="1040" y="200" width="380" height="260" rx="14"/>
<rect x="80" y="730" width="380" height="260" rx="14"/>
<rect x="560" y="730" width="380" height="260" rx="14"/>
</g>
<g fill="#DCFCE7" stroke="#15803D" stroke-width="3">
<rect x="1520" y="200" width="320" height="260" rx="14"/>
<rect x="1520" y="730" width="320" height="260" rx="14"/>
</g>

<g font-size="30" font-weight="700" fill="#0F172A">
<text x="110" y="270">Helm chart in the</text>
<text x="110" y="310">output folder</text>
<text x="590" y="270">Review the chart</text>
<text x="1070" y="270">helm or a CI job</text>
<text x="1070" y="310">applies the chart</text>
<text x="1550" y="340">Cluster</text>
<text x="110" y="800">Bicep provisions</text>
<text x="110" y="840">the AKS cluster</text>
<text x="590" y="800">Deploys the</text>
<text x="590" y="840">Helm charts</text>
<text x="1550" y="870">AKS cluster</text>
</g>
<g font-size="26" fill="#64748B">
<text x="110" y="410"><tspan font-family="Consolas, 'Courier New', monospace">aspire-output</tspan> by default</text>
<text x="590" y="372">publish doesn't</text>
<text x="590" y="408">change the cluster</text>
</g>

<g stroke="#334155" stroke-width="4" marker-end="url(#pd-ah)">
<line x1="462" y1="330" x2="556" y2="330"/>
<line x1="942" y1="330" x2="1036" y2="330"/>
