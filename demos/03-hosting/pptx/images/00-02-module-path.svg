<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="mp-title mp-desc">
<title id="mp-title">The five topics of the hosting module in order</title>
<desc id="mp-desc">Three blue cards for Container Apps: 01 Aspire Deploy, ACR and Container Apps; 02 Key Vault and App Configuration, secrets and settings; 03 Revisions, traffic splitting and draining. An elbow arrow leads from card 03 to two green cards: 04 AKS, the routing service with Dapr actors; 05 Application Insights, traces and KQL.</desc>
