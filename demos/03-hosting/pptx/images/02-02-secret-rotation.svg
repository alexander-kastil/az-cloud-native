<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="sr-title sr-desc">
<title id="sr-title">Rotating carrier-api-key through Key Vault events</title>
<desc id="sr-desc">Thirty days before the expiration date, Key Vault sends Microsoft.KeyVault.SecretNearExpiry to Event Grid, which delivers the event to the rotation function. The function calls SetSecretAsync, which writes a new version of carrier-api-key, and Key Vault sends Microsoft.KeyVault.SecretNewVersionCreated to Event Grid. The function restarts the Container Apps revision, and the container reads the new version from Key Vault.</desc>
<defs>
<marker id="sr-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#F8FAFC"/>

<g stroke="#94A3B8" stroke-width="2" stroke-dasharray="10 8">
<line x1="190" y1="150" x2="190" y2="960"/>
<line x1="860" y1="150" x2="860" y2="960"/>
<line x1="1330" y1="150" x2="1330" y2="960"/>
<line x1="1720" y1="150" x2="1720" y2="960"/>
</g>

<rect x="40" y="40" width="300" height="110" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<rect x="710" y="40" width="300" height="110" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
<rect x="1180" y="40" width="300" height="110" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<rect x="1570" y="40" width="300" height="110" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<g font-size="30" font-weight="700" fill="#0F172A" text-anchor="middle">
<text x="190" y="106">Key Vault</text>
<text x="860" y="106">Event Grid</text>
<text x="1330" y="106">rotation function</text>
<text x="1720" y="88">Container Apps</text>
<text x="1720" y="126">revision</text>
</g>

<rect x="40" y="180" width="500" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="64" y="222" font-size="26" fill="#334155">30 days before the expiration date</text>

<g stroke="#334155" stroke-width="3" marker-end="url(#sr-ah)">
<line x1="190" y1="330" x2="858" y2="330"/>
<line x1="860" y1="440" x2="1328" y2="440"/>
<line x1="1330" y1="550" x2="192" y2="550"/>
<line x1="190" y1="660" x2="858" y2="660"/>
<line x1="1330" y1="770" x2="1718" y2="770"/>
<line x1="1720" y1="880" x2="192" y2="880"/>
</g>

<g font-size="26" fill="#0F172A" text-anchor="middle">
<text x="525" y="314" font-family="Consolas, 'Courier New', monospace">Microsoft.KeyVault.SecretNearExpiry</text>
<text x="1095" y="424">deliver the event</text>
<text x="525" y="500"><tspan font-family="Consolas, 'Courier New', monospace">SetSecretAsync</tspan> writes a new version</text>
<text x="525" y="534">of <tspan font-family="Consolas, 'Courier New', monospace">carrier-api-key</tspan></text>
<text x="525" y="644" font-family="Consolas, 'Courier New', monospace">Microsoft.KeyVault.SecretNewVersionCreated</text>
<text x="1525" y="754">restart the revision</text>
<text x="525" y="864">the container reads the new version</text>
</g>

<g fill="#1D4ED8" stroke="#FFFFFF" stroke-width="3">
<circle cx="100" cy="330" r="24"/>
<circle cx="100" cy="440" r="24"/>
<circle cx="100" cy="550" r="24"/>
<circle cx="100" cy="660" r="24"/>
<circle cx="100" cy="770" r="24"/>
<circle cx="100" cy="880" r="24"/>
</g>
<g font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<text x="100" y="339">1</text>
<text x="100" y="449">2</text>
<text x="100" y="559">3</text>
<text x="100" y="669">4</text>
<text x="100" y="779">5</text>
<text x="100" y="889">6</text>
</g>
</svg>
