<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">How messages move through the Grey Logistics app</title>
<desc id="desc">The customer app sends BookShipment to shipping-api. shipping-api writes the shipment to Cosmos DB and sends ReserveCapacity to routing-service, which keeps its VanActor state in the routingstate container. The outbox relay in shipping-api publishes ShipmentBooked to the shipment-events topic in Service Bus, and the topic delivers one copy to tracking-service and one to exception-agent. tracking-service writes the tracking read model in Cosmos DB and caches in Managed Redis. Van positions from van-simulator stream through Event Hubs to telemetry-ingest, which saves checkpoints in Blob Storage and pushes each position over SignalR to the live map in ops-console. Parcel scanners send ParcelScanned to the parcel-events topic, which delivers one copy to scan-processor and one to notification-service for email and SMS. scan-processor writes the tracking read model. ops-console calls shipping-api, exception-agent calls a Foundry model, and Event Grid sends ParcelDelivered to partners. The Durable Task Scheduler holds the booking saga.</desc>
