<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1300" width="1920" height="1300" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Contoso Logistics system map with the module that adds each part</title>
<desc id="desc">Van telematics, simulated by van-simulator, stream to Event Hubs, and Event Hubs feeds telemetry-ingest. telemetry-ingest writes checkpoints to Blob Storage and pushes van positions over SignalR to the ops-console live map. The customer app sends BookShipment to shipping-api, and the ops-console also calls shipping-api. shipping-api stores shipments in Cosmos DB, publishes through its outbox relay to Service Bus, and sends ReserveCapacity to routing-service, which keeps its VanActor state in the routingstate container of Cosmos DB. Parcel scanners send ParcelScanned to Service Bus, whose topics shipment-events and parcel-events deliver to scan-processor, tracking-service, notification-service and exception-agent. scan-processor and tracking-service write the tracking read model in Cosmos DB, and tracking-service caches in Managed Redis. exception-agent, the AI agent, calls a Foundry model. Event Grid sends ParcelDelivered to partners. The Durable Task Scheduler holds the booking saga. telemetry-ingest, shipping-api, scan-processor, tracking-service, notification-service and exception-agent run on Azure Container Apps, and routing-service runs on AKS. shipping-api, tracking-service, notification-service and routing-service run with a Dapr sidecar. Module tags: Module 2 adds shipping-api, tracking-service, routing-service and the ops console; Module 3 adds Container Apps and AKS; Module 4 adds Service Bus, scan-processor and notification-service; Module 5 adds Event Hubs, Event Grid, Blob Storage, telemetry-ingest and van-simulator; Module 6 adds Cosmos DB and Managed Redis; Module 7 adds Dapr; Module 8 adds the Durable Task Scheduler; Module 9 adds exception-agent and the Foundry model.</desc>
