<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">One booking over time: shipping-api waits for routing-service, tracking-service catches up later</title>
<desc id="desc">Five lanes on a time axis: Customer app, shipping-api, routing-service, Message broker and tracking-service. BookShipment reaches shipping-api, which calls routing-service with ReserveCapacity and waits for the CapacityAssignment. Then the customer gets 202 Accepted with the shipment ID. ShipmentBooked is stored in the message broker while tracking-service restarts, and the broker delivers it once tracking-service is running.</desc>
