<title id="title">From sticky notes to services: the Contoso booking flow on an event storming wall</title>
<desc id="desc">Four stages. Big picture: the events ShipmentBooked and ParcelScanned on a timeline, and the hotspot Who approves a reroute. Process level: the actor Customer issues BookShipment, the Shipment aggregate emits ShipmentBooked, the booking request issues ReserveCapacity, and the policy BookingSagaOrchestrator issues CapturePayment. Bounded contexts: dashed boundaries around Booking, Routing and Billing. Services: the boundaries are tagged shipping-api, routing-service and billing-service.</desc>
