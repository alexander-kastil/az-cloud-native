<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="bj-title bj-desc">
<title id="bj-title">Exponential backoff with jitter for four clients</title>
<desc id="bj-desc">Four clients each call one busy service at 0 seconds and fail. Each client retries near 1, 2, 4 and 8 seconds, so the gap between retries doubles, and each retry is moved by its own random offset, so no two clients retry in the same instant. Every row ends at a retry limit bar at 16 seconds.</desc>
<style>
.p{transform-box:fill-box;transform-origin:center;animation-duration:15s;animation-iteration-count:infinite;animation-timing-function:ease-out}
#cur{animation:cur 15s linear infinite}
@keyframes cur{0%{transform:translateX(0);opacity:0}2.0%{transform:translateX(0);opacity:1}3.33%{transform:translateX(0);opacity:1}70.0%{transform:translateX(1360px);opacity:1}73.0%,100%{transform:translateX(1360px);opacity:0}}
.f{animation-name:f}
