</g>
<g text-anchor="middle" font-size="32" font-weight="700" fill="#B91C1C">
<text x="96" y="116">1</text>
<text x="721" y="116">2</text>
<text x="1346" y="116">3</text>
<text x="96" y="1156">6</text>
<text x="721" y="1156">5</text>
<text x="1346" y="1156">4</text>
