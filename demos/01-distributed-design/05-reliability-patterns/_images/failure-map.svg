<line x1="280" y1="470" x2="388" y2="470" stroke="#334155" stroke-width="4" marker-end="url(#ah)"/>
<text x="334" y="454" text-anchor="middle" font-size="26" fill="#0F172A">commit</text>

<rect x="390" y="310" width="310" height="320" rx="18" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<text x="545" y="360" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Cosmos DB</text>
<text x="545" y="398" text-anchor="middle" font-size="26" fill="#64748B">shipments container</text>
<rect x="420" y="426" width="250" height="64" rx="12" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
<text x="545" y="467" text-anchor="middle" font-size="26" fill="#0F172A">Shipment</text>
<rect x="420" y="510" width="250" height="64" rx="12" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
<text x="545" y="551" text-anchor="middle" font-size="26" fill="#0F172A">outbox event</text>

