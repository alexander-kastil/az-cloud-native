<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1250" width="1920" height="1250" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="fm-title fm-desc">
<title id="fm-title">Where each failure happens in one booking flow</title>
<desc id="fm-desc">shipping-api commits a Shipment and an outbox event to the shipments container in Cosmos DB, and the relay publishes to the Service Bus topic shipment-events. The topic copies each message to tracking-subscription and exception-agent-subscription, which deliver to tracking-service and exception-agent. In booking-worker, BookingSagaOrchestrator calls ReserveCapacity, CapturePayment and PrintLabel. Six numbered badges mark where each failure happens: 1, transactional outbox, on the publish step after the commit; 2, claim check, where the message enters Service Bus; 3, idempotent consumer, on delivery to tracking-service; 4, dead-lettering, at the dead-letter queue, which receives a message after 10 failed deliveries; 5, saga, spanning the three steps the orchestrator calls; 6, retry with backoff and jitter, on the call to PrintLabel.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
