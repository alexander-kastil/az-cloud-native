<text x="804" y="504" text-anchor="middle" font-size="26" fill="#0F172A">publish</text>

<rect x="900" y="330" width="540" height="510" rx="18" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<text x="1170" y="378" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Service Bus</text>
<text x="925" y="428" font-size="26" fill="#64748B">topic shipment-events</text>
<rect x="925" y="442" width="490" height="56" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
<g fill="#FEF3C7" stroke="#B45309" stroke-width="2">
<rect x="940" y="452" width="40" height="36" rx="6"/>
<rect x="990" y="452" width="40" height="36" rx="6"/>
