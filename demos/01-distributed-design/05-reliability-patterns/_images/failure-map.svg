<rect x="665" y="1080" width="590" height="130" rx="18"/>
<rect x="1290" y="1080" width="590" height="130" rx="18"/>
</g>
<g fill="#FEE2E2" stroke="#B91C1C" stroke-width="4">
<circle cx="96" cy="105" r="30"/>
<circle cx="721" cy="105" r="30"/>
<circle cx="1346" cy="105" r="30"/>
<circle cx="96" cy="1145" r="30"/>
<circle cx="721" cy="1145" r="30"/>
