<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="bc-title bc-desc">
<title id="bc-title">Service Bus, Event Grid, Event Hubs and Dapr pub/sub by ordering, retention and dead-letter</title>
<desc id="bc-desc">Four columns. Service Bus carries messages: FIFO within a session, retention until the message time to live expires, a dead-letter sub-queue. Event Grid carries events: no ordering guarantee, a custom topic TTL of 1 to 1440 minutes and up to 7 days for a namespace topic, dead-letter to a storage account when configured. Event Hubs carries a stream: ordering per partition, retention of 1 to 90 days depending on tier, no built-in dead-letter. Dapr pub/sub is a portability layer whose ordering, retention and dead-letter depend on the component.</desc>
