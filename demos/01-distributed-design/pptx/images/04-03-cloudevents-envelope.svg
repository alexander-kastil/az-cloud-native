<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="ce-title ce-desc">
<title id="ce-title">A ParcelScanned notification in the CloudEvents 1.0 envelope</title>
<desc id="ce-desc">The envelope holds four required attributes: specversion 1.0, type com.grey.logistics.ParcelScanned, source /grey/logistics/scanners/hub-ams-01 and an id. The type names the business fact, the source identifies the producer, and the id is unique per event, so a consumer uses it to detect a duplicate. Three optional attributes follow: time, subject parcels/CL-2026-000142 and datacontenttype application/json; the subject names the parcel, so routing and filtering work without parsing data. The data attribute carries the payload: parcelId, shipmentId, trackingNumber CL-2026-000142, scanType AtHub, scanLocation Vienna Hub and scannedAt.</desc>
