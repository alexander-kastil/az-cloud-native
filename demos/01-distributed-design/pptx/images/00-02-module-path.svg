<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="mp-title mp-desc">
<title id="mp-title">The six topics of module 1 in the order of a design decision</title>
<desc id="mp-desc">Two rows of three numbered cards, read left to right. The first row, where the seams belong: 01 Modular Monolith vs. Microservices, when a service boundary earns its cost; 02 Sync vs. Async: Commands and Events, request/reply, messages and temporal coupling; 03 Event Storming: Find Service Boundaries, bounded contexts and the Grey service list. A connector leads from card 03 to card 04. The second row, messages across the seams: 04 Event Types: Domain, Integration, CloudEvents, payload styles and the CloudEvents 1.0 envelope; 05 Reliability Patterns: Outbox, Saga, Idempotency, the failures that break event flows; 06 Azure Messaging: Pick the Broker, Service Bus, Event Grid, Event Hubs and Dapr pub/sub.</desc>
