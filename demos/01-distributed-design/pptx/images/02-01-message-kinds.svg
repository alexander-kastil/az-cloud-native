<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="mk-title mk-desc">
<title id="mk-title">Commands, events and queries with their Contoso examples</title>
<desc id="mk-desc">Three lanes. Command: an imperative verb, the sender expects an action or a failure; Booking sends ReserveCapacity to Routing, and the sender names the receiver. Event: a past-tense fact, the sender expects nothing from the consumers; a parcel scanner publishes ParcelScanned, which reaches Tracking, and any number of services can react. Query: a read request, the sender expects the current data; the tracking page sends an HTTP GET to the tracking read model and gets the current data back.</desc>
<defs>
<marker id="mk-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>

<g fill="#FFFFFF" stroke="#94A3B8" stroke-width="2">
<rect x="40" y="50" width="1840" height="300" rx="24"/>
<rect x="40" y="390" width="1840" height="300" rx="24"/>
<rect x="40" y="730" width="1840" height="300" rx="24"/>
</g>
