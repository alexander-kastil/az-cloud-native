<line x1="620" y1="80" x2="620" y2="320"/>
<line x1="620" y1="420" x2="620" y2="660"/>
<line x1="620" y1="760" x2="620" y2="1000"/>
</g>

<g font-size="38" font-weight="700">
<text x="90" y="140" fill="#1D4ED8">Command</text>
<text x="90" y="480" fill="#B45309">Event</text>
<text x="90" y="820" fill="#15803D">Query</text>
</g>
<g font-size="28" font-weight="600" fill="#0F172A">
<text x="90" y="190">Imperative verb</text>
<text x="90" y="530">Past-tense fact</text>
<text x="90" y="870">Read request</text>
</g>
<g font-size="26" fill="#64748B">
<text x="90" y="245">The sender expects an action,</text>
<text x="90" y="280">or a failure</text>
<text x="90" y="585">The sender expects nothing</text>
<text x="90" y="620">from the consumers</text>
<text x="90" y="925">The sender expects the</text>
<text x="90" y="960">current data</text>
</g>

