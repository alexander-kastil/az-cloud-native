<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1420" width="1920" height="1420" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Contoso traffic on each service</title>
<desc id="desc">Service Bus: ParcelScanned messages of one session leave the tracking subscription of the parcel-events topic in order and are removed once scan-processor consumes them, and an unreadable label scan that keeps failing moves to the dead-letter queue. Event Hubs: VanPositionReported entries append to a partition keyed by van ID, telemetry-ingest reads them and pushes each position over SignalR to the ops console map, and the entries stay after they are read. Event Grid: a driver's photo in Blob Storage raises a system event, label-service publishes ParcelDelivered to a custom topic, and Event Grid pushes it to every partner at once. Dapr pub/sub: the publishing service sends DeliveryDelayed through the Dapr API to notification-service.</desc>
