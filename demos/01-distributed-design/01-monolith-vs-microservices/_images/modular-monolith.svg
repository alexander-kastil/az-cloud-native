<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" width="1920" height="760" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Modular monolith, then Routing moved out</title>
<desc id="desc">Left: one deployable unit holds the Booking, Routing, Billing and Labels modules. Each module sits over its own schema and exposes an interface, and Booking calls the Routing interface in process. Right: Routing runs as routing-service, its own deployment with the same interface, and Booking reaches that interface over a network call.</desc>
