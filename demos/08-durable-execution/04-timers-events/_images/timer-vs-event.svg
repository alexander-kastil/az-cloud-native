<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960" role="img" aria-labelledby="tv-title tv-desc" font-family="'Segoe UI', Inter, Arial, sans-serif">
<title id="tv-title">DeliveryDeadlineOrchestrator: the two-phase race between timers and external events, and its three outcomes</title>
<desc id="tv-desc">Phase 1 races ParcelDelivered against a timer for the delivery window, input.WindowSeconds, and phase 2 races RerouteApproved against a 24 h timer. Run 1: ParcelDelivered arrives first, the window timer is cancelled, and the result is delivered. Run 2: the window timer fires, RaiseDeliveryDelayed publishes DeliveryDelayed, RerouteApproved arrives within 24 h, the 24 h timer is cancelled, RerouteParcel runs, and the result is rerouted. Run 3: the window timer fires, DeliveryDelayed is published, the 24 h timer runs out, and the result is reroute declined. The worker stays free while the orchestration waits.</desc>
