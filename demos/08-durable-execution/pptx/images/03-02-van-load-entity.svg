<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="vl8-title vl8-desc">
<title id="vl8-title">The VanLoad entity for van-17 processes queued operations one at a time</title>
<desc id="vl8-desc">Three callers send operations to the entity VanLoad with the ID van-17. The LoadVan client signals Load through client.Entities.SignalEntityAsync, one-way. VanLoadOrchestrator signals Load through context.Entities.SignalEntityAsync, one-way, and calls Get through context.Entities.CallEntityAsync, which waits for the result. The operations Load, Load and Get queue up and reach the entity one at a time. The entity runs on an EntityTrigger with TaskEntityDispatcher, keeps the state Parcels, the parcels the van carries, offers Load(count), Unload(count) and Get(), and keeps its state under 1 MB. client.Entities.GetEntityAsync reads a snapshot of the state that can be stale.</desc>
<defs>
<marker id="vl8-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
