<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="mp8-title mp8-desc">
<title id="mp8-title">The seven topics of the durable execution module in order</title>
<desc id="mp8-desc">Seven numbered topic cards read left to right in two rows. Top row: 01 Durable Execution, replay and determinism; 02 Durable Task Scheduler, managed backend; 03 Durable Functions, orchestrations and entities; 04 Durable Timers, external events and approvals. A connector runs from card 04 down to the bottom row: 05 Durable Task SDK, KEDA-scaled workers; 06 Dapr Workflow, portable orchestrations; 07 Saga Orchestration, compensating activities.</desc>
