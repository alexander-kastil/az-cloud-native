<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="sk8-title sk8-desc">
<title id="sk8-title">Dedicated and Consumption SKUs of the Durable Task Scheduler</title>
<desc id="sk8-desc">Two cards compare the SKUs. Dedicated reserves capacity units: fixed monthly cost per capacity unit, 2,000 actions per second per unit, data retention up to 90 days, high availability with three capacity units, best fit for production with predictable volume, 25 schedulers per region per subscription and 25 task hubs per region per subscription. Consumption bills per action, a message the scheduler dispatches: pay per action dispatched, 500 actions per second, data retention up to 30 days, no high availability option, best fit for development and variable workloads, 10 schedulers per region per subscription and 5 task hubs per scheduler.</desc>
<rect width="1920" height="1080" fill="#FFFFFF"/>

<rect x="60" y="90" width="860" height="900" rx="20" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<rect x="1000" y="90" width="860" height="900" rx="20" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<text x="100" y="150" font-size="38" font-weight="700" fill="#0F172A">Dedicated</text>
<text x="100" y="192" font-size="26" fill="#334155">reserves capacity units (CUs)</text>
<text x="1040" y="150" font-size="38" font-weight="700" fill="#0F172A">Consumption</text>
<text x="1040" y="192" font-size="26" fill="#334155">an action is a message the scheduler dispatches</text>

