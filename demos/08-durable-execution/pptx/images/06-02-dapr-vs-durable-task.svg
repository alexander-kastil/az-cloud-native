<text x="1188" y="287" font-size="26" fill="#0F172A">a state store component</text>
<text x="1188" y="323" font-size="26" fill="#0F172A">that supports workflows</text>
<rect x="440" y="352" width="700" height="88" rx="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<rect x="1160" y="352" width="700" height="88" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
