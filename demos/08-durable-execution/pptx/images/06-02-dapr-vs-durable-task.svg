<text x="468" y="223" font-size="26" fill="#0F172A">or the Functions extension</text>
<text x="1188" y="205" font-size="26" fill="#0F172A">Dapr.Workflow</text>
<rect x="440" y="252" width="700" height="88" rx="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<rect x="1160" y="252" width="700" height="88" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
