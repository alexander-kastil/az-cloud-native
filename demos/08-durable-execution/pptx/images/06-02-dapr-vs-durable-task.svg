<text x="468" y="387" font-size="26" fill="#0F172A">ScheduleNewOrchestrationInstanceAsync,</text>
<text x="468" y="423" font-size="26" fill="#0F172A">status URLs</text>
<text x="1188" y="387" font-size="26" fill="#0F172A">ScheduleNewWorkflowAsync,</text>
<text x="1188" y="423" font-size="26" fill="#0F172A">GetWorkflowStateAsync</text>
<rect x="440" y="452" width="700" height="88" rx="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<rect x="1160" y="452" width="700" height="88" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
<text x="60" y="505" font-size="26" font-weight="600" fill="#334155">External events</text>
<text x="468" y="505" font-size="26" fill="#0F172A">RaiseEventAsync</text>
