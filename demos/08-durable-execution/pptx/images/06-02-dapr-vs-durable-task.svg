<text x="468" y="916" font-size="26" font-weight="600" fill="#0F172A">the service runs on Functions or Container Apps,</text>
<text x="468" y="954" font-size="26" font-weight="600" fill="#0F172A">and the backend is a managed Azure service</text>
<text x="1188" y="897" font-size="26" font-weight="600" fill="#0F172A">the service already runs on AKS with Dapr,</text>
<text x="1188" y="935" font-size="26" font-weight="600" fill="#0F172A">one component model for state, messaging</text>
<text x="1188" y="973" font-size="26" font-weight="600" fill="#0F172A">and workflows</text>
