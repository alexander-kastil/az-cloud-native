<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="dd8-title dd8-desc">
<title id="dd8-title">Durable Task and Dapr Workflow compared</title>
<desc id="dd8-desc">A comparison of Durable Task, meaning Functions and the SDKs, with Dapr Workflow. .NET package: Microsoft.DurableTask.Worker.AzureManaged or the Functions extension, against Dapr.Workflow. State backend: the Durable Task Scheduler, against a state store component that supports workflows. Start and read state: ScheduleNewOrchestrationInstanceAsync and status URLs, against ScheduleNewWorkflowAsync and GetWorkflowStateAsync. External events: RaiseEventAsync, against raising an event through the HTTP or gRPC management API. Azure hosting: Functions, Container Apps, AKS, App Service and VMs, against AKS through the Dapr extension. Upgrade model: an Azure-managed backend, against a Dapr runtime version that the team schedules. Both replay the code against its history under determinism rules after a failure. Choose Durable Task when the service runs on Functions or Container Apps with a managed Azure backend, and Dapr Workflow when the service already runs on AKS with Dapr and wants one component model for state, messaging and workflows.</desc>
<rect width="1920" height="1080" fill="#FFFFFF"/>

<rect x="440" y="40" width="700" height="96" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<rect x="1160" y="40" width="700" height="96" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
