<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="ks8-title ks8-desc">
<title id="ks8-title">The azure-durabletask-scheduler scale rule sets the route-worker replica count from the activity backlog</title>
<desc id="ks8-desc">RouteClient starts instances with ScheduleNewOrchestrationInstanceAsync on the Durable Task Scheduler, which holds the bookings task hub and an activity backlog of pending work items. The scheduler pushes work items to route-worker on Container Apps, which runs 1 to 10 replicas. The scale rule dts-activities of type azure-durabletask-scheduler, with endpoint, taskhubName=bookings, workItemType=Activity, maxConcurrentWorkItemsCount=1 and a scale rule identity, polls the scheduler and sets the replica count.</desc>
<defs>
<marker id="ks8-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>

<rect x="60" y="70" width="460" height="130" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<text x="92" y="124" font-size="30" font-weight="700" fill="#0F172A">RouteClient</text>
<text x="92" y="166" font-size="26" fill="#64748B">starts instances</text>

<rect x="60" y="300" width="780" height="440" rx="18" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<text x="92" y="352" font-size="30" font-weight="700" fill="#0F172A">Durable Task Scheduler</text>
<g fill="#FFFFFF" stroke="#B45309" stroke-width="2">
<rect x="92" y="380" width="716" height="120" rx="12"/>
<rect x="92" y="530" width="716" height="180" rx="12"/>
</g>
<text x="120" y="430" font-size="30" font-weight="700" fill="#0F172A">bookings</text>
<text x="120" y="472" font-size="26" fill="#64748B">task hub</text>
<text x="120" y="576" font-size="28" font-weight="700" fill="#0F172A">Activity backlog</text>
<text x="120" y="614" font-size="26" fill="#64748B">pending work items</text>
<g fill="#FEF3C7" stroke="#B45309" stroke-width="2">
<rect x="120" y="640" width="90" height="44" rx="8"/>
<rect x="226" y="640" width="90" height="44" rx="8"/>
<rect x="332" y="640" width="90" height="44" rx="8"/>
<rect x="438" y="640" width="90" height="44" rx="8"/>
<rect x="544" y="640" width="90" height="44" rx="8"/>
<rect x="650" y="640" width="90" height="44" rx="8"/>
</g>

<rect x="1100" y="300" width="760" height="440" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="1132" y="352" font-size="30" font-weight="700" fill="#0F172A">Container Apps</text>
<g fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2">
<rect x="1172" y="384" width="560" height="120" rx="12"/>
<rect x="1152" y="404" width="560" height="120" rx="12"/>
<rect x="1132" y="424" width="560" height="120" rx="12"/>
</g>
<text x="1162" y="476" font-size="30" font-weight="700" fill="#0F172A">route-worker</text>
<text x="1162" y="516" font-size="26" fill="#64748B">replica</text>
<text x="1132" y="612" font-size="30" font-weight="700" fill="#0F172A">1 to 10 replicas</text>
<text x="1132" y="654" font-size="26" fill="#64748B">--min-replicas 1 --max-replicas 10</text>

<rect x="60" y="830" width="1800" height="190" rx="18" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
<text x="92" y="886" font-size="30" font-weight="700" fill="#0F172A">dts-activities</text>
<text x="92" y="928" font-size="26" fill="#334155">type azure-durabletask-scheduler</text>
<text x="92" y="968" font-size="26" fill="#64748B">scale rule</text>
<g fill="#FFFFFF" stroke="#6D28D9" stroke-width="2">
<rect x="660" y="856" width="150" height="60" rx="10"/>
<rect x="830" y="856" width="320" height="60" rx="10"/>
<rect x="1170" y="856" width="320" height="60" rx="10"/>
<rect x="660" y="934" width="440" height="60" rx="10"/>
<rect x="1120" y="934" width="270" height="60" rx="10"/>
</g>
<g font-size="26" fill="#0F172A" text-anchor="middle">
<text x="735" y="895">endpoint</text>
<text x="990" y="895">taskhubName=bookings</text>
<text x="1330" y="895">workItemType=Activity</text>
<text x="880" y="973">maxConcurrentWorkItemsCount=1</text>
<text x="1255" y="973">scale rule identity</text>
</g>

<g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#ks8-ah)">
<line x1="290" y1="202" x2="290" y2="298"/>
<line x1="842" y1="440" x2="1098" y2="440"/>
</g>
<g fill="none" stroke="#6D28D9" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ks8-ah)">
<line x1="450" y1="828" x2="450" y2="742"/>
<line x1="1500" y1="828" x2="1500" y2="742"/>
</g>
<g font-size="26" fill="#334155">
<text x="310" y="260">ScheduleNewOrchestrationInstanceAsync</text>
<text x="970" y="422" text-anchor="middle">pushes work items</text>
<text x="470" y="794">polls</text>
<text x="1520" y="794">sets replica count</text>
</g>
</svg>
