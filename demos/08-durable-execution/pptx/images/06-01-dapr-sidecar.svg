<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="ds8-title ds8-desc">
<title id="ds8-title">Dapr Workflow in booking-worker with its sidecar, components and hosting</title>
<desc id="ds8-desc">booking-worker holds ParcelBookingWorkflow, a Workflow of string and string, which calls ReserveCapacityActivity, a WorkflowActivity of string and string, with CallActivityAsync. DaprWorkflowClient starts it with ScheduleNewWorkflowAsync and reads it with GetWorkflowStateAsync, and AddDaprWorkflow() registers the classes. The Dapr sidecar with the app ID booking-worker keeps the history log and replays the workflow after a crash, restart or redeployment. It uses a state store component that supports workflows and a messaging component. Hosting: on AKS the Dapr cluster extension installs the runtime and supports the current and previous Dapr version, and WorkflowAccessPolicy is a Kubernetes custom resource. Locally, Aspire attaches the sidecar with WithDaprSidecar() from CommunityToolkit.Aspire.Hosting.Dapr, after dapr init.</desc>
