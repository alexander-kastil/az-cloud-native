.cap1{animation:cap1 16s infinite}
.cap2{animation:cap2 16s infinite}
.cap3{animation:cap3 16s infinite}
.cap4{animation:cap4 16s infinite}
.w1b{animation:w1b 16s infinite}
.w1r{animation:w1r 16s infinite}
.w1run{animation:w1run 16s infinite}
.w1rep{animation:w1rep 16s infinite}
.w2g{animation:w2g 16s infinite}
