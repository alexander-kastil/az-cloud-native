<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 840" width="1920" height="840" role="img" aria-labelledby="rp-title rp-desc" font-family="'Segoe UI', Inter, Arial, sans-serif">
<title id="rp-title">Replay after a crash: a second worker rebuilds the orchestration from its event history</title>
<desc id="rp-desc">Worker 1 runs BookingSagaOrchestrator. Line 1 schedules ReserveCapacity, and TaskScheduled and TaskCompleted are appended to the event history. Worker 1 replays line 1 from the history and line 2 schedules CapturePayment, which completes and charges the customer once. Worker 1 crashes. Worker 2 replays lines 1 and 2 from the history without scheduling them again, then schedules PrintLabel. The customer is still charged 1x.</desc>
<style>
