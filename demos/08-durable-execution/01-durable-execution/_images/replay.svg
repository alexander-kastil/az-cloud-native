.l1b{animation:l1b 16s infinite}
.l1g{animation:l1g 16s infinite}
.l2b{animation:l2b 16s infinite}
.l2g{animation:l2g 16s infinite}
.l3b{animation:l3b 16s infinite}
.f01{animation:f01 16s infinite}
.f23{animation:f23 16s infinite}
.a0{animation:a0 16s infinite}
