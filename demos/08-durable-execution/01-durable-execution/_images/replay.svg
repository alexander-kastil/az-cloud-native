@keyframes h2{0%,31.25%{opacity:0;transform:translateX(30px)}32.5%,100%{opacity:1;transform:translateX(0)}}
@keyframes h3{0%,37.5%{opacity:0;transform:translateX(30px)}38.75%,100%{opacity:1;transform:translateX(0)}}
@keyframes h4{0%,67.5%{opacity:0;transform:translateX(30px)}68.75%,100%{opacity:1;transform:translateX(0)}}
@keyframes c0{0%,37.5%{opacity:1}38.75%,100%{opacity:0}}
