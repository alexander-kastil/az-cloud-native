<text x="264" y="418" font-size="26" font-weight="600" fill="#15803D" text-anchor="middle">result from history</text>
</g>
<g class="l3b">
<rect x="60" y="476" width="880" height="160" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<rect x="124" y="560" width="300" height="50" rx="25" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<text x="274" y="594" font-size="26" font-weight="600" fill="#1D4ED8" text-anchor="middle">schedules PrintLabel</text>
</g>
<text x="94" y="184" font-size="28" font-weight="700" fill="#64748B" text-anchor="middle">1</text>
<text x="124" y="184" font-size="26" fill="#64748B">await context.CallActivityAsync(<tspan font-weight="700" fill="#0F172A">"ReserveCapacity"</tspan>, parcelId)</text>
<text x="94" y="360" font-size="28" font-weight="700" fill="#64748B" text-anchor="middle">2</text>
<text x="124" y="360" font-size="26" fill="#64748B">await context.CallActivityAsync(<tspan font-weight="700" fill="#0F172A">"CapturePayment"</tspan>, parcelId)</text>
<text x="94" y="536" font-size="28" font-weight="700" fill="#64748B" text-anchor="middle">3</text>
<text x="124" y="536" font-size="26" fill="#64748B">await context.CallActivityAsync(<tspan font-weight="700" fill="#0F172A">"PrintLabel"</tspan>, parcelId)</text>
<g class="w1b" opacity="0">
<rect x="1000" y="130" width="240" height="240" rx="16" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
</g>
<g class="w1r">
<rect x="1000" y="130" width="240" height="240" rx="16" fill="#FEE2E2" stroke="#B91C1C" stroke-width="3"/>
<text x="1120" y="292" font-size="26" font-weight="600" fill="#B91C1C" text-anchor="middle">crashed</text>
</g>
<text x="1120" y="242" font-size="30" font-weight="700" fill="#0F172A" text-anchor="middle">Worker 1</text>
<text class="w1run" opacity="0" x="1120" y="292" font-size="26" font-weight="600" fill="#1D4ED8" text-anchor="middle">runs</text>
