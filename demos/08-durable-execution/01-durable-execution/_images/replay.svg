<rect x="1324" y="492" width="532" height="76" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
<text x="1348" y="540" font-size="26" fill="#0F172A"><tspan font-weight="700">TaskScheduled</tspan> PrintLabel</text>
</g>
<rect class="f01" opacity="0" x="1314" y="116" width="552" height="184" rx="14" fill="none" stroke="#15803D" stroke-width="6"/>
