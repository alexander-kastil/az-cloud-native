<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" role="img" aria-labelledby="co-title co-desc">
<title id="co-title">Choreography versus orchestration for the booking saga</title>
<desc id="co-desc">Choreography: the capacity, payment and label services pass events to each other, capacity reserved and payment captured, and no coordinator exists. Orchestration: inside one booking-worker, BookingSagaOrchestrator calls the activities ReserveCapacity, CapturePayment and PrintLabel and stores the saga state.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#334155"/></marker>
</defs>
<rect x="0" y="0" width="1920" height="900" fill="#F8FAFC"/>
<g font-family="'Segoe UI', Inter, Arial, sans-serif">

<rect x="40" y="40" width="900" height="820" rx="24" fill="none" stroke="#94A3B8" stroke-width="2"/>
<text x="490" y="120" text-anchor="middle" font-size="36" font-weight="700" fill="#0F172A">Choreography</text>

<rect x="100" y="200" width="280" height="580" rx="18" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3" stroke-dasharray="14 10"/>
<text x="240" y="500" text-anchor="middle" font-size="28" fill="#64748B">no coordinator</text>

<rect x="640" y="200" width="260" height="100" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="770" y="246" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Capacity</text>
<text x="770" y="282" text-anchor="middle" font-size="26" fill="#64748B">service</text>

<line x1="770" y1="300" x2="770" y2="345" stroke="#334155" stroke-width="4"/>
<rect x="645" y="345" width="250" height="50" rx="25" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<text x="770" y="379" text-anchor="middle" font-size="26" fill="#0F172A">capacity reserved</text>
<line x1="770" y1="395" x2="770" y2="424" stroke="#334155" stroke-width="4" marker-end="url(#ah)"/>

<rect x="640" y="440" width="260" height="100" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="770" y="486" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Payment</text>
<text x="770" y="522" text-anchor="middle" font-size="26" fill="#64748B">service</text>

<line x1="770" y1="540" x2="770" y2="585" stroke="#334155" stroke-width="4"/>
<rect x="645" y="585" width="250" height="50" rx="25" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<text x="770" y="619" text-anchor="middle" font-size="26" fill="#0F172A">payment captured</text>
<line x1="770" y1="635" x2="770" y2="664" stroke="#334155" stroke-width="4" marker-end="url(#ah)"/>

<rect x="640" y="680" width="260" height="100" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="770" y="726" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Label</text>
<text x="770" y="762" text-anchor="middle" font-size="26" fill="#64748B">service</text>

<rect x="980" y="40" width="900" height="820" rx="24" fill="none" stroke="#94A3B8" stroke-width="2"/>
<text x="1430" y="120" text-anchor="middle" font-size="36" font-weight="700" fill="#0F172A">Orchestration</text>

<rect x="1010" y="150" width="840" height="680" rx="20" fill="none" stroke="#64748B" stroke-width="3"/>
<text x="1040" y="196" font-size="28" font-weight="700" fill="#0F172A">booking-worker</text>

<rect x="1040" y="220" width="280" height="580" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="1180" y="282" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">BookingSaga</text>
<text x="1180" y="320" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Orchestrator</text>
<rect x="1070" y="696" width="220" height="74" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<text x="1180" y="743" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">saga state</text>

<line x1="1320" y1="250" x2="1542" y2="250" stroke="#334155" stroke-width="4" marker-end="url(#ah)"/>
<line x1="1320" y1="490" x2="1542" y2="490" stroke="#334155" stroke-width="4" marker-end="url(#ah)"/>
<line x1="1320" y1="730" x2="1542" y2="730" stroke="#334155" stroke-width="4" marker-end="url(#ah)"/>

<rect x="1560" y="200" width="260" height="100" rx="18" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/>
<text x="1690" y="246" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">ReserveCapacity</text>
<text x="1690" y="282" text-anchor="middle" font-size="26" fill="#64748B">activity</text>

<rect x="1560" y="440" width="260" height="100" rx="18" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/>
<text x="1690" y="486" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">CapturePayment</text>
<text x="1690" y="522" text-anchor="middle" font-size="26" fill="#64748B">activity</text>

<rect x="1560" y="680" width="260" height="100" rx="18" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/>
<text x="1690" y="726" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">PrintLabel</text>
<text x="1690" y="762" text-anchor="middle" font-size="26" fill="#64748B">activity</text>

</g>
</svg>
