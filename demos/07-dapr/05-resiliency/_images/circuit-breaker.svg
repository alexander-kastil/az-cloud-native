<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 830" width="1920" height="830" role="img" aria-labelledby="cb-title cb-desc">
<title id="cb-title">cbPolicy with only trip set, on Dapr defaults, over time for calls from the shipping-api sidecar to routing-service</title>
<desc id="cb-desc">Time runs from left to right. cbPolicy sets only trip, so interval, timeout and maxRequests keep their defaults. While cbPolicy is Closed, call 1 fails four times: the first attempt and three retries, 2s apart. Each failed attempt raises consecutiveFailures, and the default interval of 0s never clears the count. The first attempt of call 2 is the fifth failure in a row, which meets the trip condition consecutiveFailures &gt;= 5. The breaker opens for the default timeout of 60s: the retry of call 2 and new calls are rejected at once, are not retried and never reach routing-service. Then the breaker is Half-open, the default maxRequests 1 lets one probe through, the probe succeeds, and the breaker is Closed again with the count at 0.</desc>
