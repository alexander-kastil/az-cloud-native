<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="cn-title cn-desc">
<title id="cn-title">One component name in the AppHost, the component file and the service code</title>
<desc id="cn-desc">The AppHost Program.cs calls builder.AddDapr(), registers the component statestore of type state.azure.cosmosdb with AddDaprComponent and LocalPath components/statestore.yaml, and attaches a Dapr sidecar to shipping-api with WithDaprSidecar and WithReference(stateStore). The component file components/statestore.yaml declares metadata name statestore and spec type state.azure.cosmosdb. The Dapr sidecar reads the component file at startup, and shipping-api passes statestore to the Dapr client. The same name statestore appears in all three places.</desc>
<defs>
<marker id="cn-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>

<rect x="60" y="110" width="860" height="700" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="90" y="165" font-size="32" font-weight="700" fill="#0F172A">AppHost<tspan font-size="26" font-weight="400" fill="#64748B" dx="16">Program.cs</tspan></text>
<rect x="90" y="195" width="800" height="585" rx="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<g font-size="26" fill="#0F172A">
<text x="120" y="250">builder.AddDapr();</text>
<text x="120" y="310">var stateStore = builder.AddDaprComponent(</text>
<text x="160" y="362"><tspan font-weight="700" fill="#BE185D">"statestore"</tspan>, "state.azure.cosmosdb",</text>
<text x="160" y="414">new DaprComponentOptions</text>
<text x="160" y="466">{ LocalPath = "components/statestore.yaml" });</text>
<text x="120" y="526">builder.AddProject&lt;Projects.ShippingApi&gt;(</text>
<text x="160" y="578">"shipping-api")</text>
<text x="160" y="630">.WithDaprSidecar(sidecar =&gt;</text>
<text x="200" y="682">sidecar.WithReference(stateStore));</text>
</g>

<path d="M1080,110 H1820 L1860,150 V400 Q1860,412 1848,412 H1092 Q1080,412 1080,400 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>
<path d="M1820,110 V150 H1860" fill="none" stroke="#334155" stroke-width="3"/>
<text x="1110" y="160" font-size="26" fill="#64748B">components/statestore.yaml</text>
<g font-size="28" fill="#0F172A">
<text x="1110" y="222">metadata:</text>
<text x="1150" y="268">name: <tspan font-weight="700" fill="#BE185D">statestore</tspan></text>
<text x="1110" y="322">spec:</text>
<text x="1150" y="368">type: state.azure.cosmosdb</text>
</g>

<rect x="1080" y="560" width="340" height="250" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="1250" y="626" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Dapr sidecar</text>
<g font-size="26" fill="#334155" text-anchor="middle">
<text x="1250" y="700">reads the</text>
<text x="1250" y="736">component file</text>
</g>

<rect x="1540" y="560" width="320" height="250" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="1700" y="626" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">shipping-api</text>
<g font-size="26" fill="#334155" text-anchor="middle">
<text x="1700" y="690">passes</text>
<text x="1700" y="726" font-weight="700" fill="#BE185D">"statestore"</text>
<text x="1700" y="762">to the Dapr client</text>
</g>

<g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#cn-ah)" stroke-linejoin="round">
<path d="M920,458 H1000 V261 H1078"/>
<line x1="920" y1="656" x2="1078" y2="656"/>
<line x1="1250" y1="412" x2="1250" y2="558"/>
<line x1="1540" y1="685" x2="1422" y2="685"/>
</g>
<text x="999" y="640" text-anchor="middle" font-size="26" fill="#334155">attaches</text>
<text x="1270" y="494" font-size="26" fill="#334155">at startup</text>

<rect x="440" y="880" width="1040" height="70" rx="35" fill="#FFFFFF" stroke="#BE185D" stroke-width="3"/>
<text x="960" y="925" text-anchor="middle" font-size="28" fill="#0F172A">the same name in the AppHost, the component file and the service code</text>
</svg>
