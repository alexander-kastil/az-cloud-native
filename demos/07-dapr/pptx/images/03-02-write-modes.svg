<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="wm-title wm-desc">
<title id="wm-title">Last-write-wins, first-write-wins and a transaction across keys</title>
<desc id="wm-desc">Two concurrency modes side by side. Last-write-wins: no ETag, the newest write replaces the value, ConcurrencyMode.LastWrite, Contoso Logistics example a driver note on a parcel. First-write-wins: the ETag from the read, the write succeeds only when the ETag matches, ConcurrencyMode.FirstWrite, Contoso Logistics example the booking status moves from Booked to PickedUp. Beside them a transaction: ExecuteStateTransactionAsync with SHP-1001 Delete and SHP-1002 Delete in one request, which succeeds for every key or fails for every key.</desc>
<defs>
<marker id="wm-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>

<rect x="60" y="140" width="540" height="800" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<rect x="640" y="140" width="540" height="800" rx="18" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<rect x="1240" y="140" width="620" height="800" rx="18" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>

<g font-size="34" font-weight="700" fill="#0F172A">
<text x="95" y="210">Last-write-wins</text>
<text x="675" y="210">First-write-wins</text>
<text x="1275" y="210">Transaction</text>
</g>

<g stroke="#94A3B8" stroke-width="2">
<line x1="95" y1="245" x2="565" y2="245"/>
<line x1="675" y1="245" x2="1145" y2="245"/>
<line x1="95" y1="395" x2="565" y2="395"/>
<line x1="675" y1="395" x2="1145" y2="395"/>
<line x1="95" y1="580" x2="565" y2="580"/>
<line x1="675" y1="580" x2="1145" y2="580"/>
<line x1="95" y1="730" x2="565" y2="730"/>
<line x1="675" y1="730" x2="1145" y2="730"/>
</g>

<g font-size="26" fill="#64748B">
<text x="95" y="295">ETag</text>
<text x="675" y="295">ETag</text>
<text x="95" y="445">write rule</text>
<text x="675" y="445">write rule</text>
<text x="95" y="630">mode</text>
<text x="675" y="630">mode</text>
<text x="95" y="780">Contoso Logistics example</text>
<text x="675" y="780">Contoso Logistics example</text>
</g>

<g font-size="28" fill="#0F172A">
<text x="95" y="345">no ETag</text>
<text x="675" y="345">the ETag from the read</text>
<text x="95" y="495">the newest write</text>
<text x="95" y="535">replaces the value</text>
<text x="675" y="495">succeeds only when</text>
<text x="675" y="535">the ETag matches</text>
<text x="95" y="680">ConcurrencyMode.LastWrite</text>
<text x="675" y="680">ConcurrencyMode.FirstWrite</text>
<text x="95" y="830" font-weight="700">driver note on a parcel</text>
<text x="675" y="830" font-weight="700">booking status moves</text>
<text x="675" y="870" font-weight="700">from Booked to PickedUp</text>
</g>

<text x="1275" y="275" font-size="28" font-weight="600" fill="#0F172A">ExecuteStateTransactionAsync</text>
<text x="1275" y="315" font-size="26" fill="#64748B">one request</text>
<g fill="#FFFFFF" stroke="#6D28D9" stroke-width="2">
<rect x="1275" y="345" width="550" height="76" rx="12"/>
<rect x="1275" y="441" width="550" height="76" rx="12"/>
</g>
<g font-size="28" font-weight="700" fill="#0F172A">
<text x="1305" y="393">SHP-1001</text>
<text x="1305" y="489">SHP-1002</text>
</g>
<g font-size="26" fill="#64748B" text-anchor="end">
<text x="1795" y="393">Delete</text>
<text x="1795" y="489">Delete</text>
</g>
<line x1="1550" y1="517" x2="1550" y2="618" stroke="#334155" stroke-width="4" marker-end="url(#wm-ah)"/>
<rect x="1275" y="620" width="550" height="180" rx="14" fill="#FFFFFF" stroke="#15803D" stroke-width="3"/>
<g font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">
<text x="1550" y="690">succeeds for every key</text>
<text x="1550" y="740">or fails for every key</text>
