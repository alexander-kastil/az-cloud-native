<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="mp-title mp-desc">
<title id="mp-title">The seven topics of the Dapr module in order</title>
<desc id="mp-desc">Seven numbered cards read left to right, four in the top row and three in the bottom row: 01 Dapr Sidecar, Run with Aspire, WithDaprSidecar; 02 Service Invocation, mTLS and Retries, InvokeMethodAsync; 03 State Stores, ETags and Concurrency, TrySaveStateAsync; 04 Pub/Sub, Swap Brokers via Components, PublishEventAsync; 05 Resiliency Policies, Retries and Breakers, Resiliency spec; 06 Dapr Actors, Virtual Actor Model, ActorProxy.Create; 07 Managed Dapr, Container Apps vs. AKS, Microsoft.Dapr.</desc>
