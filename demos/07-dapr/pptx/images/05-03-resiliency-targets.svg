<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="rt-title rt-desc">
<title id="rt-title">Where the resiliency targets apply</title>
<desc id="rt-desc">Your app and the pubsub broker both reach the Dapr sidecar. From the sidecar, the target apps.routing-service covers calls to the routing-service sidecar and on to routing-service, actors.VanActor covers calls to VanActor, components.statestore.outbound covers calls to statestore, and components.pubsub.inbound covers delivery to the subscription handler in your app.</desc>
<defs>
<marker id="rt-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>

<rect x="60" y="300" width="320" height="140" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="220" y="381" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Your app</text>

<rect x="60" y="640" width="320" height="140" rx="18" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<text x="220" y="702" text-anchor="middle" font-size="30" font-weight="700" fill="#BE185D">pubsub</text>
<text x="220" y="742" text-anchor="middle" font-size="26" fill="#334155">broker</text>

<rect x="480" y="330" width="320" height="420" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="640" y="551" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Dapr sidecar</text>

<rect x="1320" y="110" width="250" height="120" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="1445" y="163" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">routing-service</text>
<text x="1445" y="200" text-anchor="middle" font-size="26" fill="#334155">sidecar</text>
<rect x="1620" y="110" width="240" height="120" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="1740" y="180" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">routing-service</text>

<rect x="1320" y="350" width="540" height="120" rx="18" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
<text x="1590" y="421" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">VanActor</text>

<rect x="1320" y="590" width="540" height="120" rx="18" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<text x="1590" y="661" text-anchor="middle" font-size="30" font-weight="700" fill="#BE185D">statestore</text>

<rect x="1320" y="830" width="540" height="120" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="1590" y="880" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Your app</text>
<text x="1590" y="920" text-anchor="middle" font-size="26" fill="#334155">subscription handler</text>

<path d="M800,540 H860 M860,170 V890" stroke="#334155" stroke-width="4" fill="none"/>
<g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#rt-ah)">
<line x1="380" y1="370" x2="478" y2="370"/>
<line x1="380" y1="710" x2="478" y2="710"/>
<line x1="858" y1="170" x2="1318" y2="170"/>
<line x1="858" y1="410" x2="1318" y2="410"/>
