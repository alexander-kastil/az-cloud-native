@keyframes chl{0%,53.5%{opacity:0}54%,58%{opacity:1}59%,100%{opacity:0}}
@keyframes p2{0%,59.5%{opacity:0}60%,66%{opacity:1}67%,100%{opacity:0}}
@keyframes ud{0%,61.9%{opacity:0;transform:translate(1462px,250px)}62%,64%{opacity:1;transform:translate(1462px,250px)}68%{opacity:1;transform:translate(1494px,357px)}68.5%,100%{opacity:0;transform:translate(1494px,357px)}}
@keyframes sen{0%,30.4%{opacity:0}30.5%,100%{opacity:1}}
