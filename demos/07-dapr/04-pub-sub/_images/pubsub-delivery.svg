<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 775" width="1920" height="775" role="img" aria-labelledby="pd-title pd-desc">
<title id="pd-title">Dapr pub/sub: the subscriber sidecar reads its subscription at startup, then every ParcelScanned event is wrapped and posted to /parcel-events</title>
<desc id="pd-desc">At startup the Dapr sidecar of notification-service calls GET /dapr/subscribe on its app and learns the subscription parcel-events to /parcel-events. tracking-service then calls PublishEventAsync("pubsub", "parcel-events", parcelScanned, …). Its sidecar wraps the ParcelScanned event in a CloudEvents 1.0 envelope that carries id, source and type for tracing and deduplication, datacontenttype copied from the Content-Type header, and the event as data. The broker topic parcel-events copies the message to each subscription. The notification-service sidecar sends it to its app as POST /parcel-events, UseCloudEvents unwraps the envelope, and the handler receives (ParcelScanned scan). Both times, the sidecar calls the app.</desc>
