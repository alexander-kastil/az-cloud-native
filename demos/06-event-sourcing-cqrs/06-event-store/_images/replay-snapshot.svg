<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 840" width="1920" height="840" role="img" aria-labelledby="title desc">
  <title id="title">Shipment SHP-10482 rebuilt by replay, then loaded from a snapshot</title>
  <desc id="desc">The Shipment aggregate SHP-10482 starts empty. Replay applies v1 ShipmentBooked, which sets promisedBy, v2 CapacityReserved, which sets vanId VAN-07, and v3 LabelPrinted, and the version counts up to 3. The stream in partition SHP-10482 of the shipments container then grows to 103 events, with a snapshot at version 100, so a replay from v1 takes 103 Apply calls. The Shipment reloads from the snapshot in one read with status OutForDelivery, vanId VAN-07 and promisedBy 2026-10-22T17:00:00Z, and only v101, v102 and v103 are applied: 3 Apply calls.</desc>
