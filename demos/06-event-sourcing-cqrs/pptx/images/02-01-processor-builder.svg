<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="pb-title pb-desc">
  <title id="pb-title">The tracking-projection change feed processor with its lease container and estimator</title>
  <desc id="pb-desc">The change feed of the shipments container, partition /shipmentId, carries ParcelScanned events to the tracking-projection processor, built with GetChangeFeedProcessorBuilder, the delegate HandleChangesAsync, WithInstanceName and WithLeaseContainer. Delivery is at least once: a throw re-reads the same batch. The processor upserts each ScanRecord into the tracking read model with UpsertItemAsync, and because the id is the event id, a repeat writes the same record. The processor checkpoints into the leases container, partition key /id, which holds the position and owner per partition range. The change feed estimator, built with GetChangeFeedEstimatorBuilder, uses the same name and lease container and reports pending changes every minute. The Azure Functions option CosmosDBTrigger uses the same processor machinery, and the platform owns scaling.</desc>
  <defs>
    <marker id="pb-ah" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L20,10 L0,20 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <g font-family="'Segoe UI', Inter, Arial, sans-serif" fill="#0F172A">

    <path d="M80,300 V540 A170,24 0 0 0 420,540 V300" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <ellipse cx="250" cy="300" rx="170" ry="24" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <text x="250" y="372" font-size="26" fill="#64748B" text-anchor="middle">Cosmos DB</text>
    <text x="250" y="412" font-size="30" font-weight="700" text-anchor="middle">shipments</text>
    <text x="250" y="452" font-size="26" fill="#64748B" text-anchor="middle">partition /shipmentId</text>
    <text x="250" y="492" font-size="26" text-anchor="middle">ParcelScanned events</text>

    <line x1="420" y1="420" x2="618" y2="420" stroke="#334155" stroke-width="3" marker-end="url(#pb-ah)"/>
    <text x="519" y="402" font-size="26" text-anchor="middle">change feed</text>

    <rect x="620" y="220" width="640" height="420" rx="20" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
    <text x="650" y="272" font-size="30" font-weight="700">tracking-projection</text>
    <text x="650" y="314" font-size="26" fill="#64748B" font-family="Consolas, 'Cascadia Mono', monospace">GetChangeFeedProcessorBuilder</text>
    <g font-size="26">
      <text x="650" y="378" fill="#64748B">delegate</text>
      <text x="890" y="378" font-family="Consolas, 'Cascadia Mono', monospace">HandleChangesAsync</text>
      <text x="650" y="422" fill="#64748B">instance name</text>
      <text x="890" y="422" font-family="Consolas, 'Cascadia Mono', monospace">WithInstanceName</text>
      <text x="650" y="466" fill="#64748B">lease container</text>
      <text x="890" y="466" font-family="Consolas, 'Cascadia Mono', monospace">WithLeaseContainer</text>
    </g>
    <rect x="646" y="500" width="588" height="116" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
    <text x="670" y="544" font-size="28" font-weight="700">at-least-once delivery</text>
    <text x="670" y="588" font-size="26">a throw re-reads the same batch</text>

    <line x1="1260" y1="420" x2="1498" y2="420" stroke="#334155" stroke-width="3" marker-end="url(#pb-ah)"/>
    <text x="1380" y="402" font-size="26" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace">UpsertItemAsync</text>

    <path d="M1500,300 V540 A170,24 0 0 0 1840,540 V300" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <ellipse cx="1670" cy="300" rx="170" ry="24" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <text x="1670" y="372" font-size="26" fill="#64748B" text-anchor="middle">Cosmos DB</text>
    <text x="1670" y="412" font-size="30" font-weight="700" text-anchor="middle">tracking</text>
    <text x="1670" y="452" font-size="26" fill="#64748B" text-anchor="middle">read model</text>
    <text x="1670" y="492" font-size="26" text-anchor="middle">ScanRecord</text>
    <text x="1670" y="616" font-size="26" fill="#64748B" text-anchor="middle">id = event id, so a repeat</text>
    <text x="1670" y="654" font-size="26" fill="#64748B" text-anchor="middle">writes the same record</text>

    <line x1="940" y1="640" x2="940" y2="746" stroke="#334155" stroke-width="3" marker-end="url(#pb-ah)"/>
    <text x="956" y="702" font-size="26">checkpoint</text>

    <path d="M750,770 V960 A190,22 0 0 0 1130,960 V770" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <ellipse cx="940" cy="770" rx="190" ry="22" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <text x="940" y="834" font-size="30" font-weight="700" text-anchor="middle">leases</text>
    <text x="940" y="874" font-size="26" fill="#64748B" text-anchor="middle">partition key /id</text>
    <text x="940" y="910" font-size="26" text-anchor="middle">position and owner</text>
    <text x="940" y="946" font-size="26" text-anchor="middle">per partition range</text>

    <line x1="1130" y1="870" x2="1358" y2="870" stroke="#334155" stroke-width="3" marker-end="url(#pb-ah)"/>

    <rect x="1360" y="770" width="490" height="200" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2.5"/>
    <text x="1384" y="814" font-size="28" font-weight="700">change feed estimator</text>
    <text x="1384" y="854" font-size="26" fill="#64748B" font-family="Consolas, 'Cascadia Mono', monospace">GetChangeFeedEstimatorBuilder</text>
    <text x="1384" y="898" font-size="26">same name and lease container</text>
    <text x="1384" y="938" font-size="26">pending changes every minute</text>

    <rect x="80" y="770" width="560" height="200" rx="18" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="110" y="814" font-size="28" font-weight="700">Azure Functions option</text>
    <text x="110" y="854" font-size="26" fill="#64748B" font-family="Consolas, 'Cascadia Mono', monospace">CosmosDBTrigger</text>
    <text x="110" y="898" font-size="26">same processor machinery,</text>
    <text x="110" y="938" font-size="26">the platform owns scaling</text>
  </g>
</svg>
