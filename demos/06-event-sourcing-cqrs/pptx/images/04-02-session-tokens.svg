<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="st-title st-desc">
  <title id="st-title">A session token carries read-your-writes from instance A to instance B</title>
  <desc id="st-desc">Seven numbered steps. 1: the browser sends a request that writes a scan to instance A, which has its own SDK client. 2: instance A calls UpsertItemAsync on the tracking container, partition /trackingNumber. 3: the container returns the session token in Headers.Session. 4: the response carries the session token to the browser, which keeps one session token per tracking number. 5: the next request goes to instance B with the token; instance B has its own SDK client and no cached token. 6: instance B calls ReadItemAsync with SessionToken in ItemRequestOptions. 7: the container returns the scan instance A wrote. The steps that carry the token are drawn in purple.</desc>
  <defs>
    <marker id="st-ah" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L20,10 L0,20 Z" fill="#334155"/>
    </marker>
    <marker id="st-ahp" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L20,10 L0,20 Z" fill="#6D28D9"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <g font-family="'Segoe UI', Inter, Arial, sans-serif" fill="#0F172A">

    <rect x="80" y="420" width="320" height="220" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
    <text x="110" y="486" font-size="30" font-weight="700">Browser</text>
    <text x="110" y="532" font-size="26">one session token</text>
    <text x="110" y="572" font-size="26">per tracking number</text>

    <rect x="760" y="140" width="400" height="180" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
    <text x="790" y="212" font-size="30" font-weight="700">Instance A</text>
    <text x="790" y="256" font-size="26" fill="#64748B">own SDK client</text>

    <rect x="760" y="760" width="400" height="180" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
    <text x="790" y="832" font-size="30" font-weight="700">Instance B</text>
    <text x="790" y="876" font-size="26" fill="#64748B">own SDK client,</text>
    <text x="790" y="912" font-size="26" fill="#64748B">no cached token</text>

    <path d="M1480,400 V700 A190,24 0 0 0 1860,700 V400" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <ellipse cx="1670" cy="400" rx="190" ry="24" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <text x="1670" y="500" font-size="30" font-weight="700" text-anchor="middle">tracking</text>
    <text x="1670" y="540" font-size="26" fill="#64748B" text-anchor="middle">Cosmos DB container</text>
    <text x="1670" y="580" font-size="26" fill="#64748B" text-anchor="middle">partition /trackingNumber</text>

    <path d="M180,420 V200 H758" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#st-ah)"/>
    <path d="M1160,200 H1720 V374" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#st-ah)"/>
    <path d="M1600,378 V280 H1162" fill="none" stroke="#6D28D9" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#st-ahp)"/>
    <path d="M758,290 H320 V418" fill="none" stroke="#6D28D9" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#st-ahp)"/>
    <path d="M180,640 V850 H758" fill="none" stroke="#6D28D9" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#st-ahp)"/>
    <path d="M1160,850 H1720 V727" fill="none" stroke="#6D28D9" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#st-ahp)"/>
    <path d="M1600,723 V790 H1162" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#st-ah)"/>

    <g font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <circle cx="236" cy="166" r="20" fill="#0F172A"/>
      <text x="236" y="175">1</text>
      <circle cx="1216" cy="166" r="20" fill="#0F172A"/>
      <text x="1216" y="175">2</text>
      <circle cx="1216" cy="326" r="20" fill="#6D28D9"/>
      <text x="1216" y="335">3</text>
      <circle cx="376" cy="330" r="20" fill="#6D28D9"/>
      <text x="376" y="339">4</text>
      <circle cx="236" cy="816" r="20" fill="#6D28D9"/>
      <text x="236" y="825">5</text>
      <circle cx="1216" cy="890" r="20" fill="#6D28D9"/>
      <text x="1216" y="899">6</text>
      <circle cx="1216" cy="750" r="20" fill="#0F172A"/>
      <text x="1216" y="759">7</text>
    </g>

    <text x="266" y="175" font-size="26">request that writes a scan</text>
    <text x="1246" y="175" font-size="26" font-family="Consolas, 'Cascadia Mono', monospace">UpsertItemAsync</text>
    <text x="1246" y="335" font-size="26" fill="#6D28D9">session token in</text>
    <text x="1246" y="371" font-size="26" fill="#6D28D9">Headers.Session</text>
    <text x="406" y="339" font-size="26" fill="#6D28D9">response plus</text>
    <text x="406" y="375" font-size="26" fill="#6D28D9">the session token</text>
    <text x="266" y="825" font-size="26" fill="#6D28D9">next request with the token</text>
    <text x="1246" y="899" font-size="26" fill="#6D28D9" font-family="Consolas, 'Cascadia Mono', monospace">ReadItemAsync with SessionToken</text>
    <text x="1246" y="935" font-size="26" fill="#6D28D9" font-family="Consolas, 'Cascadia Mono', monospace">in ItemRequestOptions</text>
    <text x="1246" y="759" font-size="26">the scan instance A wrote</text>
  </g>
</svg>
