<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="uc-title uc-desc">
  <title id="uc-title">ShipmentBookedUpcaster turns every stored ShipmentBooked into ShipmentBookedV2 on read</title>
  <desc id="uc-desc">The event store keeps its stored events untouched: ShipmentBooked with schemaVersion 1 and no serviceLevel, and ShipmentBooked with schemaVersion 2 and serviceLevel express. Both pass through ShipmentBookedUpcaster on the read path, where v1 gets serviceLevel = standard and every read runs the upcaster. The result is ShipmentBookedV2, which feeds Replay, Projections and exception-agent-subscription.</desc>
  <defs>
    <marker id="uc-ah" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L20,10 L0,20 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <g font-family="'Segoe UI', Inter, Arial, sans-serif" fill="#0F172A">

    <rect x="80" y="110" width="540" height="550" rx="22" fill="#FFFFFF" stroke="#15803D" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="110" y="160" font-size="28" font-weight="700">event store</text>
    <text x="110" y="196" font-size="26" fill="#64748B">stored events untouched</text>

    <rect x="120" y="226" width="460" height="180" rx="14" fill="#FFEDD5" stroke="#C2410C" stroke-width="2.5"/>
    <text x="144" y="276" font-size="28" font-weight="700">ShipmentBooked</text>
    <text x="144" y="320" font-size="26">schemaVersion 1</text>
    <text x="144" y="360" font-size="26" fill="#64748B">no serviceLevel</text>

    <rect x="120" y="446" width="460" height="180" rx="14" fill="#FFEDD5" stroke="#C2410C" stroke-width="2.5"/>
    <text x="144" y="496" font-size="28" font-weight="700">ShipmentBooked</text>
    <text x="144" y="540" font-size="26">schemaVersion 2</text>
    <text x="144" y="580" font-size="26">serviceLevel express</text>

    <line x1="580" y1="316" x2="738" y2="316" stroke="#334155" stroke-width="3" marker-end="url(#uc-ah)"/>
    <line x1="580" y1="500" x2="738" y2="500" stroke="#334155" stroke-width="3" marker-end="url(#uc-ah)"/>

    <rect x="740" y="250" width="500" height="290" rx="20" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
    <text x="770" y="306" font-size="28" font-weight="700">ShipmentBookedUpcaster</text>
    <text x="770" y="348" font-size="26" fill="#64748B">on the read path</text>
    <text x="770" y="414" font-size="26">v1 gets serviceLevel = standard</text>
    <text x="770" y="490" font-size="26" fill="#64748B">every read runs the upcaster</text>

    <line x1="1240" y1="385" x2="1398" y2="385" stroke="#334155" stroke-width="3" marker-end="url(#uc-ah)"/>

    <rect x="1400" y="325" width="400" height="120" rx="16" fill="#FFEDD5" stroke="#C2410C" stroke-width="2.5"/>
    <text x="1600" y="396" font-size="28" font-weight="700" text-anchor="middle">ShipmentBookedV2</text>

    <line x1="1600" y1="445" x2="1600" y2="778" stroke="#334155" stroke-width="3" marker-end="url(#uc-ah)"/>
    <path d="M1600,650 H810 V778" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#uc-ah)"/>
    <line x1="1140" y1="650" x2="1140" y2="778" stroke="#334155" stroke-width="3" marker-end="url(#uc-ah)"/>

    <rect x="680" y="780" width="260" height="120" rx="16" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
    <text x="810" y="851" font-size="28" font-weight="700" text-anchor="middle">Replay</text>
    <rect x="990" y="780" width="300" height="120" rx="16" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
    <text x="1140" y="851" font-size="28" font-weight="700" text-anchor="middle">Projections</text>
    <rect x="1340" y="780" width="520" height="120" rx="16" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
    <text x="1600" y="851" font-size="28" font-weight="700" text-anchor="middle">exception-agent-subscription</text>
  </g>
</svg>
