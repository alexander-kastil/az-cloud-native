<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="ec-title ec-desc">
  <title id="ec-title">What the ops console shows before and after the projection runs</title>
  <desc id="ec-desc">Three moments from left to right. The write commits: the ops console sends BookShipment, shipping-api saves the event document and its outbox event, and answers 202 Accepted with a status link. Change feed delay: the ops console shows the shipment as received and polls, tracking-service queries by trackingNumber and finds no ScanRecord yet, and the console gets an empty list and keeps polling. After the change feed delivers: the projection upserts the first ScanRecord into the read model, tracking-service returns it, and the first scan appears in the ops console on the next poll.</desc>
  <defs>
    <marker id="ec-ah" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L20,10 L0,20 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <g font-family="'Segoe UI', Inter, Arial, sans-serif" fill="#0F172A">

    <rect x="60" y="100" width="520" height="800" rx="24" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2.5"/>
    <text x="320" y="166" font-size="28" font-weight="700" text-anchor="middle">the write commits</text>
    <rect x="700" y="100" width="520" height="800" rx="24" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="12 8"/>
    <text x="960" y="166" font-size="28" font-weight="700" text-anchor="middle" fill="#475569">change feed delay</text>
    <rect x="1340" y="100" width="520" height="800" rx="24" fill="#FFFFFF" stroke="#15803D" stroke-width="3"/>
    <text x="1600" y="166" font-size="28" font-weight="700" text-anchor="middle">after the change feed delivers</text>

    <line x1="580" y1="156" x2="698" y2="156" stroke="#334155" stroke-width="3" marker-end="url(#ec-ah)"/>
    <line x1="1220" y1="156" x2="1338" y2="156" stroke="#334155" stroke-width="3" marker-end="url(#ec-ah)"/>

    <rect x="100" y="210" width="440" height="170" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/>
    <text x="124" y="254" font-size="26" fill="#64748B">ops console</text>
    <text x="124" y="298" font-size="28" font-weight="700">BookShipment</text>
    <text x="124" y="338" font-size="26">to shipping-api</text>
    <line x1="320" y1="380" x2="320" y2="442" stroke="#334155" stroke-width="3" marker-end="url(#ec-ah)"/>
    <rect x="100" y="444" width="440" height="170" rx="16" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
    <text x="124" y="488" font-size="26" fill="#64748B">shipping-api</text>
    <text x="124" y="532" font-size="28" font-weight="700">saves the event document</text>
    <text x="124" y="572" font-size="26">and its outbox event</text>
    <line x1="320" y1="614" x2="320" y2="676" stroke="#334155" stroke-width="3" marker-end="url(#ec-ah)"/>
    <rect x="100" y="678" width="440" height="170" rx="16" fill="#FFFFFF" stroke="#15803D" stroke-width="2.5"/>
    <text x="124" y="722" font-size="26" fill="#64748B">shipping-api</text>
    <text x="124" y="766" font-size="28" font-weight="700" fill="#15803D">202 Accepted</text>
    <text x="124" y="806" font-size="26">with a status link</text>

    <rect x="740" y="210" width="440" height="170" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/>
    <text x="764" y="254" font-size="26" fill="#64748B">ops console</text>
    <text x="764" y="298" font-size="28" font-weight="700">shipment shown</text>
    <text x="764" y="338" font-size="26">as received</text>
    <line x1="960" y1="380" x2="960" y2="442" stroke="#334155" stroke-width="3" marker-end="url(#ec-ah)"/>
    <text x="978" y="420" font-size="26">polls</text>
    <rect x="740" y="444" width="440" height="170" rx="16" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
    <text x="764" y="488" font-size="26" fill="#64748B">tracking-service</text>
    <text x="764" y="532" font-size="28" font-weight="700">query by trackingNumber</text>
    <text x="764" y="572" font-size="26">no ScanRecord yet</text>
    <line x1="960" y1="614" x2="960" y2="676" stroke="#334155" stroke-width="3" marker-end="url(#ec-ah)"/>
    <rect x="740" y="678" width="440" height="170" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/>
    <text x="764" y="722" font-size="26" fill="#64748B">ops console</text>
    <text x="764" y="766" font-size="28" font-weight="700">empty list</text>
    <text x="764" y="806" font-size="26">keep polling</text>

    <rect x="1380" y="210" width="440" height="170" rx="16" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
    <text x="1404" y="254" font-size="26" fill="#64748B">projection</text>
    <text x="1404" y="298" font-size="28" font-weight="700">first ScanRecord</text>
    <text x="1404" y="338" font-size="26">upserted into the read model</text>
    <line x1="1600" y1="380" x2="1600" y2="442" stroke="#334155" stroke-width="3" marker-end="url(#ec-ah)"/>
    <rect x="1380" y="444" width="440" height="170" rx="16" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
    <text x="1404" y="488" font-size="26" fill="#64748B">tracking-service</text>
    <text x="1404" y="532" font-size="28" font-weight="700">query by trackingNumber</text>
    <text x="1404" y="572" font-size="26">returns the first ScanRecord</text>
    <line x1="1600" y1="614" x2="1600" y2="676" stroke="#334155" stroke-width="3" marker-end="url(#ec-ah)"/>
    <rect x="1380" y="678" width="440" height="170" rx="16" fill="#FFFFFF" stroke="#15803D" stroke-width="2.5"/>
    <text x="1404" y="722" font-size="26" fill="#64748B">ops console</text>
    <text x="1404" y="766" font-size="28" font-weight="700" fill="#15803D">first scan appears</text>
    <text x="1404" y="806" font-size="26">on the next poll</text>
  </g>
</svg>
