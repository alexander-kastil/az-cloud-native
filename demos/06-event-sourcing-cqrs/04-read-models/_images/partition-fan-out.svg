<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960" role="img" aria-labelledby="pf-title pf-desc">
<title id="pf-title">Which partitions of the tracking container each kind of read touches</title>
<desc id="pf-desc">The tracking container is drawn three times as four physical partitions. A point read with ReadItemAsync passes the id and the partition key and goes straight to one item in one partition, skipping the query engine. A query with the partition key in QueryRequestOptions reaches one partition and returns that parcel's scans for the tracking page. The ops console search runs a query without a partition key, which fans out to all four partitions, so its charge grows with the partition count.</desc>
