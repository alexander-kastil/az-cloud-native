@keyframes ka{0%,9%{opacity:0}9.8%{opacity:1}11.5%,20.8%{opacity:0}21.6%{opacity:1}23.3%,100%{opacity:0}}
@keyframes kc{0%,33%{opacity:0}33.8%{opacity:1}35.5%,45%{opacity:0}45.8%{opacity:1}47.5%,57%{opacity:0}57.8%{opacity:1}59.5%,69%{opacity:0}69.8%{opacity:1}71.5%,100%{opacity:0}}
@keyframes gu{0%,3%{transform:scaleX(0)}15%{transform:scaleX(.4)}28%{transform:scaleX(.14)}40%{transform:scaleX(.1)}52%,100%{transform:scaleX(0)}}
@keyframes gb{0%,3%{transform:scaleX(0)}11%{transform:scaleX(.26)}24%{transform:scaleX(.55)}42%{transform:scaleX(.85)}60%{transform:scaleX(.45)}78%,100%{transform:scaleX(.06)}}
@keyframes pu{0%,15%{opacity:0}16.5%,100%{opacity:1}}
@keyframes pb{0%,42%{opacity:0}43.5%,100%{opacity:1}}
@keyframes mf{0%,11%{transform:scaleY(0)}14%,23%{transform:scaleY(.31)}27%,100%{transform:scaleY(.92)}}
@keyframes r1{0%,10%{opacity:0}11.5%,100%{opacity:1}}
@keyframes r2{0%,22%{opacity:0}23.5%,100%{opacity:1}}
@keyframes r3{0%,22.8%{opacity:0}24.3%,100%{opacity:1}}
@keyframes f1{0%,73.9%{transform:translate(0,0);opacity:0}74%{transform:translate(0,0);opacity:1}77%,100%{transform:translate(60px,47px);opacity:1}}
@keyframes f2{0%,74.9%{transform:translate(0,0);opacity:0}75%{transform:translate(0,0);opacity:1}77%,100%{transform:translate(36px,-28px);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
