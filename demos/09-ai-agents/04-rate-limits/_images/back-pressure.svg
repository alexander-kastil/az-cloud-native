<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="bp-title bp-desc">
<title id="bp-title">The queues absorb a DeliveryDelayed burst while the exception agent drains them at the rate the quota allows</title>
<desc id="bp-desc">booking-worker publishes DeliveryDelayed events through parcel-events, 30 per minute during the burst. The events fill exceptions-urgent and exceptions-bulk faster than the agent drains them, and the queue depth gauges rise. KEDA polls both queues every 30 seconds and adds exception-agent replicas up to the maxReplicas 3 line. Each replica holds one call in flight, so the chat deployment with 30,000 TPM receives about 15 calls per minute and stays below the line where it returns 429. The urgent queue drains first, then the bulk queue, while booking-worker keeps publishing. booking-worker never sees a 429.</desc>
<style>
.a{animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:linear}
.du{animation-name:du}
.db{animation-name:db}
.cd{animation-name:cd}
.kp{animation-name:kp}
.ka{animation-name:ka}
.kc{animation-name:kc}
#gu{animation-name:gu}
#gb{animation-name:gb}
#pu{animation-name:pu}
#pb{animation-name:pb}
#mf{animation-name:mf}
#r1{animation-name:r1}
#r2{animation-name:r2}
#r3{animation-name:r3}
#f1{animation-name:f1}
#f2{animation-name:f2}
