<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1036" width="1920" height="1036" role="img" aria-labelledby="pq-title pq-desc">
<title id="pq-title">Three priority queue layouts for urgent and bulk exceptions, with the layout the lab uses marked</title>
<desc id="pq-desc">In every layout booking-worker publishes the DeliveryDelayed events. Left: one queue holds urgent and bulk messages with a priority value, and one consumer pool takes the highest priority first, so the starvation risk depends on the broker and the consumer logic. Middle, marked as the layout the lab uses: an urgent queue and a bulk queue feed one consumer pool that is always busy with urgent work, so bulk messages pile up and can wait indefinitely. Right: the urgent queue and the bulk queue each have their own pool, so each pool drains its own queue at its own pace and the starvation risk is low.</desc>
<defs><marker id="pq-ah" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#334155"/></marker><marker id="pq-ahm" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#94A3B8"/></marker></defs>
