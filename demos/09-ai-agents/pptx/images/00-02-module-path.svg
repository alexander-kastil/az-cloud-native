<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="mp-title mp-desc">
<title id="mp-title">The six topics of the AI agents module in order</title>
<desc id="mp-desc">Two rows of three numbered topic cards, read left to right. The first row, captioned The model as one step in the flow, holds 01 Microsoft.Extensions.AI: Foundry Model Client, 02 Agent Subscribers: React to Events and 03 LLM Calls: Durable Activities. An elbow connector leads from card 03 down to the second row, captioned Quota, search and coordination, which holds 04 Rate Limits: Priority Queues and KEDA, 05 Vector Search: Change Feed Embeddings and 06 Agent Choreography: Events vs. A2A.</desc>
<defs>
<marker id="mp-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>

<text x="960" y="120" text-anchor="middle" font-size="32" font-weight="700" fill="#0F172A">The model as one step in the flow</text>
<text x="960" y="590" text-anchor="middle" font-size="32" font-weight="700" fill="#0F172A">Quota, search and coordination</text>

