<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="fc-title fc-desc">
<title id="fc-title">How the exception-agent reaches a Foundry model deployment through IChatClient</title>
<desc id="fc-desc">The exception-agent depends on IChatClient and calls GetResponseAsync or GetStreamingResponseAsync. AddChatClient registers the client once in dependency injection: AzureOpenAIClient, GetChatClient with the deployment name, then AsIChatClient. The AppHost settings Foundry:Endpoint and Foundry:ChatDeployment feed AddChatClient. DefaultAzureCredential signs in with the Azure CLI sign-in locally and with the managed identity in Azure, so Entra ID replaces a key. The client calls the Foundry resource at its resource endpoint, https://&lt;resource&gt;.openai.azure.com/, where the chat deployment carries a name you choose. The identity holds the role Cognitive Services OpenAI User on that resource.</desc>
<defs>
<marker id="fc-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>

<rect x="560" y="70" width="720" height="150" rx="18" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<text x="590" y="128" font-size="30" font-weight="700" fill="#0F172A">AppHost settings</text>
<text x="590" y="180" font-size="27" fill="#0F172A">Foundry:Endpoint, Foundry:ChatDeployment</text>

<rect x="60" y="300" width="470" height="350" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="90" y="360" font-size="32" font-weight="700" fill="#0F172A">exception-agent</text>
<text x="90" y="402" font-size="27" fill="#64748B">depends on IChatClient</text>
<g fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2">
<rect x="90" y="440" width="410" height="80" rx="12"/>
<rect x="90" y="540" width="410" height="80" rx="12"/>
</g>
<g font-size="27" font-weight="600" fill="#0F172A">
<text x="115" y="490">GetResponseAsync</text>
<text x="115" y="590">GetStreamingResponseAsync</text>
</g>

<rect x="640" y="300" width="560" height="350" rx="18" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
<text x="670" y="360" font-size="32" font-weight="700" fill="#0F172A">AddChatClient</text>
<text x="670" y="402" font-size="27" fill="#64748B">registered once in DI</text>
<g fill="#FFFFFF" stroke="#6D28D9" stroke-width="2">
<rect x="670" y="430" width="500" height="62" rx="12"/>
<rect x="670" y="502" width="500" height="62" rx="12"/>
<rect x="670" y="574" width="500" height="62" rx="12"/>
</g>
<g font-size="27" font-weight="600" fill="#0F172A">
<text x="695" y="471">AzureOpenAIClient</text>
<text x="695" y="543">GetChatClient(deployment)</text>
<text x="695" y="615">AsIChatClient()</text>
</g>

<rect x="1310" y="300" width="550" height="350" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="1340" y="360" font-size="32" font-weight="700" fill="#0F172A">Foundry resource</text>
<text x="1340" y="402" font-size="27" fill="#64748B">resource endpoint</text>
<g font-family="Consolas, 'Courier New', monospace" font-size="27" fill="#0F172A">
<text x="1340" y="444">https://&lt;resource&gt;.</text>
<text x="1340" y="480">openai.azure.com/</text>
</g>
<rect x="1340" y="510" width="490" height="115" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
<text x="1365" y="556" font-size="28" font-weight="700" fill="#0F172A">chat deployment</text>
<text x="1365" y="600" font-size="27" fill="#64748B">a name you choose</text>

<rect x="640" y="760" width="560" height="270" rx="18" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<text x="670" y="815" font-size="30" font-weight="700" fill="#0F172A">DefaultAzureCredential</text>
<text x="670" y="868" font-size="27" fill="#0F172A">local: your Azure CLI sign-in</text>
<text x="670" y="913" font-size="27" fill="#0F172A">in Azure: the managed identity</text>
<text x="670" y="978" font-size="27" fill="#64748B">Entra ID instead of a key</text>

<text x="1240" y="945" font-size="27" fill="#64748B">role on the identity</text>
<text x="1240" y="985" font-size="27" font-weight="700" fill="#0F172A">Cognitive Services OpenAI User</text>

