<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1140" width="1920" height="1140" role="img" aria-labelledby="ca-title ca-desc">
<title id="ca-title">Choreography and A2A side by side for a delayed parcel</title>
<desc id="ca-desc">Left, choreography: booking-worker publishes DeliveryDelayed to the broker, which delivers it to the exception-agent. The exception-agent publishes RerouteRequested. Dashed arrows tagged design show what the design adds: the broker delivers RerouteRequested to routing, and a reporting consumer added next quarter receives the next DeliveryDelayed while booking-worker stays unchanged. Right, A2A, tagged design and drawn with dashed arrows: the ops console fetches /.well-known/agent-card.json from the exception-agent. The card lists the name, the skills, the bindings JSON-RPC 2.0, gRPC and HTTP with JSON, and the authentication it accepts. The ops console picks JSON-RPC 2.0 and sends the task explain one delay. The callee moves the task state from submitted to working to completed, the caller runs its own timeout, and the answer returns before the timeout ends.</desc>
