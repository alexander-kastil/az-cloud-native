<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="as-title as-desc">
<title id="as-title">An AI coding agent and an app outside the AppHost share the standalone dashboard</title>
<desc id="as-desc">A Python or Node.js app that runs outside an AppHost sets OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 and OTEL_EXPORTER_OTLP_PROTOCOL=grpc and sends OTLP to the standalone dashboard. The standalone dashboard starts with aspire dashboard run or the mcr.microsoft.com/aspire/dashboard container image, serves the dashboard UI on port 18888 and receives OTLP over gRPC on 4317 and over HTTP on 4318. It is an OTLP viewer for any app that exports OpenTelemetry and has no AppHost, so it has no resource start and stop controls. An AI coding agent, set up with aspire agent init for the detected agent environments, calls the tools of the MCP server that aspire agent mcp --dashboard-url "http://localhost:18888" connects to the dashboard. The tools are list_structured_logs, list_resources, list_console_logs and list_traces, and the standalone connection exposes telemetry tools only.</desc>
<defs>
<marker id="as-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>

<rect x="40" y="70" width="580" height="350" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="64" y="124" font-size="30" font-weight="700" fill="#0F172A">Python or Node.js app</text>
<text x="64" y="164" font-size="26" fill="#64748B">runs outside an AppHost</text>
<g font-size="26" font-weight="600" fill="#0F172A">
<text x="64" y="232">OTEL_EXPORTER_OTLP_ENDPOINT=</text>
<text x="88" y="272">http://localhost:4317</text>
<text x="64" y="336">OTEL_EXPORTER_OTLP_PROTOCOL=</text>
<text x="88" y="376">grpc</text>
</g>

<rect x="1300" y="70" width="580" height="350" rx="18" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<text x="1324" y="124" font-size="30" font-weight="700" fill="#0F172A">AI coding agent</text>
<text x="1324" y="190" font-size="26" font-weight="600" fill="#0F172A">aspire agent init</text>
<g font-size="26" fill="#64748B">
<text x="1324" y="230">sets up agent configuration for</text>
<text x="1324" y="270">the detected agent environments</text>
<text x="1324" y="336">reads the same resources, logs</text>
<text x="1324" y="376">and traces as the developer</text>
</g>

<rect x="40" y="540" width="1020" height="460" rx="18" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
<text x="64" y="596" font-size="30" font-weight="700" fill="#0F172A">Standalone dashboard</text>
<text x="64" y="642" font-size="26" font-weight="600" fill="#0F172A">aspire dashboard run</text>
<text x="64" y="682" font-size="26" fill="#64748B">or the mcr.microsoft.com/aspire/dashboard container image</text>
<g fill="#FFFFFF" stroke="#6D28D9" stroke-width="2.5">
<rect x="64" y="716" width="300" height="64" rx="10"/>
<rect x="384" y="716" width="320" height="64" rx="10"/>
<rect x="724" y="716" width="312" height="64" rx="10"/>
</g>
<g font-size="26" fill="#0F172A">
<text x="84" y="757"><tspan font-weight="700">18888</tspan> dashboard UI</text>
<text x="404" y="757"><tspan font-weight="700">4317</tspan> OTLP over gRPC</text>
<text x="744" y="757"><tspan font-weight="700">4318</tspan> OTLP over HTTP</text>
</g>
<g font-size="26" fill="#64748B">
<text x="64" y="856">OTLP viewer for any app that exports OpenTelemetry</text>
<text x="64" y="900">no AppHost, so no resource start and stop controls</text>
</g>

<rect x="1300" y="540" width="580" height="460" rx="18" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
