<g font-size="26" font-weight="600" fill="#0F172A">
<text x="1324" y="642">aspire agent mcp</text>
<text x="1348" y="682">--dashboard-url</text>
<text x="1348" y="722">"http://localhost:18888"</text>
<text x="1324" y="812">list_structured_logs</text>
<text x="1640" y="812">list_resources</text>
<text x="1324" y="852">list_console_logs</text>
<text x="1640" y="852">list_traces</text>
</g>
<g font-size="26" fill="#64748B">
<text x="1324" y="772">tools</text>
<text x="1324" y="922">standalone connection:</text>
<text x="1324" y="962">telemetry tools only</text>
</g>

<g stroke="#334155" stroke-width="3" marker-end="url(#as-ah)">
<line x1="330" y1="420" x2="330" y2="538"/>
<line x1="1590" y1="420" x2="1590" y2="538"/>
