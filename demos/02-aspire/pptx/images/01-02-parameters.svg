<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="pa-title pa-desc">
<title id="pa-title">How the AppHost resolves the routing API key parameter</title>
<desc id="pa-desc">In the AppHost, builder.AddParameter("routing-api-key", secret: true) declares the value, and secret marks it as sensitive. Aspire looks for the value in order: 1 environment variables, as Parameters__routing_api_key with dashes replaced by underscores, 2 configuration files and user secrets, 3 it asks the developer when no source holds the value, on the first run. The AppHost starts routing-service from AddProject with .WithEnvironment("ROUTING_API_KEY", routingApiKey), so routing-service receives the value as the environment variable ROUTING_API_KEY and the key stays out of source.</desc>
<defs>
<marker id="pa-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>

<rect x="40" y="60" width="1340" height="960" rx="24" fill="none" stroke="#334155" stroke-width="2.5"/>
<text x="70" y="116" font-size="32" font-weight="700" fill="#0F172A">AppHost</text>

<g fill="#FFFFFF" stroke="#94A3B8" stroke-width="2.5">
<rect x="70" y="160" width="620" height="250" rx="14"/>
<rect x="70" y="660" width="620" height="300" rx="14"/>
</g>
<g font-size="26" font-weight="600" fill="#0F172A">
<text x="94" y="212">var routingApiKey =</text>
<text x="94" y="252">builder.AddParameter(</text>
<text x="124" y="292">"routing-api-key",</text>
<text x="124" y="332"><tspan fill="#BE185D" font-weight="700">secret: true</tspan>);</text>
<text x="94" y="710">builder.AddProject&lt;</text>
<text x="124" y="750">Projects.RoutingService&gt;(</text>
<text x="124" y="790">"routing-service")</text>
<text x="94" y="850">.WithEnvironment(</text>
<text x="124" y="890">"ROUTING_API_KEY",</text>
<text x="124" y="930">routingApiKey);</text>
</g>
<text x="94" y="385" font-size="26" fill="#64748B">secret marks the value as sensitive</text>

<text x="770" y="188" font-size="26" fill="#64748B">Aspire looks for the value</text>
<g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3">
<rect x="760" y="210" width="540" height="170" rx="14"/>
<rect x="760" y="440" width="540" height="170" rx="14"/>
</g>
<rect x="760" y="670" width="540" height="170" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<g fill="#1D4ED8">
<circle cx="801" cy="256" r="21"/>
<circle cx="801" cy="486" r="21"/>
<circle cx="801" cy="716" r="21"/>
</g>
<g font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<text x="801" y="265">1</text>
<text x="801" y="495">2</text>
<text x="801" y="725">3</text>
</g>
<g font-size="28" font-weight="700" fill="#0F172A">
<text x="836" y="266">Environment variables</text>
<text x="836" y="496">Configuration files</text>
<text x="836" y="536">and user secrets</text>
<text x="836" y="726">Asks the developer</text>
</g>
<text x="790" y="318" font-size="26" font-weight="600" fill="#0F172A">Parameters__routing_api_key</text>
<g font-size="26" fill="#64748B">
<text x="790" y="358">dashes become underscores</text>
<text x="790" y="776">when no source holds the value,</text>
<text x="790" y="814">on the first run</text>
</g>

<g stroke="#334155" stroke-width="3" marker-end="url(#pa-ah)">
<line x1="690" y1="290" x2="758" y2="290"/>
<line x1="1030" y1="380" x2="1030" y2="438"/>
<line x1="1030" y1="610" x2="1030" y2="668"/>
<line x1="1344" y1="525" x2="1478" y2="525"/>
</g>
<path d="M1314 222H1344V828H1314" fill="none" stroke="#64748B" stroke-width="3" stroke-linejoin="round"/>
<path d="M690 905H1680V682" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#pa-ah)"/>
<g font-size="26" fill="#64748B" text-anchor="middle">
<text x="1430" y="508">value</text>
<text x="1530" y="888">starts</text>
</g>

<rect x="1480" y="380" width="400" height="300" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="1504" y="432" font-size="30" font-weight="700" fill="#0F172A">routing-service</text>
<text x="1504" y="472" font-size="26" fill="#64748B">Projects.RoutingService</text>
<rect x="1504" y="500" width="352" height="56" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.5"/>
<text x="1524" y="537" font-size="26" font-weight="600" fill="#0F172A">ROUTING_API_KEY</text>
<g font-size="26" fill="#64748B">
<text x="1504" y="604">environment variable</text>
<text x="1504" y="644">the key stays out of source</text>
</g>
</svg>
