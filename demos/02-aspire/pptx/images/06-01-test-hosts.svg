<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="th-title th-desc">
<title id="th-title">WebApplicationFactory and DistributedApplicationTestingBuilder side by side</title>
<desc id="th-desc">On the left, the test process with WebApplicationFactory: the test sends HTTP through TestServer to shipping-api in memory, and a stub, such as a fake clock or a fake client, replaces one registration. It starts quickly and needs no container runtime. On the right, the test process with DistributedApplicationTestingBuilder: the test calls StartAsync on the AppHost, which starts shipping-api and tracking-service as separate processes and the Service Bus emulator and the Cosmos DB emulator as containers, and the test sends real HTTP to shipping-api. It starts every AppHost resource, including emulators, needs a container runtime and starts more slowly.</desc>
<defs>
<marker id="th-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>

