<rect x="100" y="460" width="600" height="150" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<rect x="100" y="750" width="600" height="150" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
