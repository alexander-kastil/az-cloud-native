<rect x="40" y="60" width="720" height="960" rx="24"/>
<rect x="860" y="60" width="1020" height="400" rx="24"/>
</g>
<g font-size="26" fill="#64748B">
<text x="70" y="116">Test process with</text>
<text x="890" y="116">Test process with</text>
</g>
<g font-size="30" font-weight="700" fill="#0F172A">
<text x="70" y="158">WebApplicationFactory</text>
<text x="890" y="158">DistributedApplicationTestingBuilder</text>
</g>

