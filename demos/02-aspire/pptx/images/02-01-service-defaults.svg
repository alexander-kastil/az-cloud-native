<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="sd-title sd-desc">
<title id="sd-title">What one AddServiceDefaults call adds to each service</title>
<desc id="sd-desc">shipping-api and tracking-service each reference the ServiceDefaults project and call builder.AddServiceDefaults() and app.MapDefaultEndpoints(). AddServiceDefaults extends IHostApplicationBuilder, so web apps and worker services use the same call. The ServiceDefaults project from the Aspire template adds four things: OpenTelemetry for logs, metrics and traces, plus the Azure.* sources, with OTEL_EXPORTER_OTLP_ENDPOINT turning on the OTLP exporter; the standard resilience handler, AddStandardResilienceHandler on every HttpClient from the factory with retries, timeouts and a circuit breaker; service discovery, where https+http://shipping-api resolves the AppHost resource name, HTTPS when available and HTTP otherwise; and the health endpoints, /health for every check and /alive for checks tagged live, mapped by MapDefaultEndpoints in Development only.</desc>
<defs>
<marker id="sd-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>

