</g>
<g font-size="26" font-weight="600" fill="#0F172A">
<text x="82" y="289">builder.AddServiceDefaults();</text>
<text x="82" y="361">app.MapDefaultEndpoints();</text>
<text x="82" y="649">builder.AddServiceDefaults();</text>
<text x="82" y="721">app.MapDefaultEndpoints();</text>
</g>
<g font-size="26" fill="#64748B">
