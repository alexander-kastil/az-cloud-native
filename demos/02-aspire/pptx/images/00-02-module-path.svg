<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="mp-title mp-desc">
<title id="mp-title">The six topics of module 2 in the order the Contoso system is built</title>
<desc id="mp-desc">Two rows of three numbered cards, read left to right. The first row, model and connect the system: 01 Aspire AppHost: Model the System, with AddProject, WithReference, WaitFor and aspire run; 02 ServiceDefaults: Telemetry, Resilience, Discovery, one call for OpenTelemetry, retries and health endpoints; 03 Aspire Integrations: Hosting and Client, hosting and client packages and RunAsEmulator. A connector leads from card 03 to card 04. The second row, observe, extend and test: 04 Aspire Dashboard: Traces Across Services, logs, traces, metrics and aspire agent mcp; 05 Polyglot AppHost: Angular and Python, AddViteApp and AddUvicornApp beside the .NET services; 06 Aspire Testing: Distributed Integration Tests, tests that start the AppHost and gates for each step.</desc>
