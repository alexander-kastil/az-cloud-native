<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="gt-title gt-desc">
<title id="gt-title">A gate test is written first and proves the step an agent builds</title>
<desc id="gt-desc">1 Write the gate: a test in tests/ContosoLogistics.Tests marked [Trait("Gate", "BookingReachesTracking")], and AGENTS.md states that the agent must not edit the test project. 2 The agent writes the code: an AI coding agent builds the step that the gate proves. 3 Run the gate with dotnet test tests/ContosoLogistics.Tests --filter "Gate=BookingReachesTracking"; without a filter every step built so far runs. When the gate passes, the step is done as a result anyone can rerun. When it fails, the agent fixes the code of the step that owns the gate and the run repeats. Each gate name reads as one promise, such as AppHostListsResources and BookingReachesTracking. A gate takes the smallest form that proves the outcome: a REST call with curl checking status code and body, a unit test in xUnit that starts no container, or an integration test that starts the whole AppHost.</desc>
<defs>
<marker id="gt-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
