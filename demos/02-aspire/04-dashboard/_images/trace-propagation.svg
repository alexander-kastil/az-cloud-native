<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 690" width="1920" height="690" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">One trace ID across HTTP and Service Bus</title>
<desc id="desc">A parcel scan travels from the scanner over HTTP to the scanner API, which sends a message through Service Bus to the consumer, and the consumer writes the tracking projection. The trace ID 4bf92f35 rides the HTTP call in the traceparent header, is copied into the message in the Diagnostic-Id property and travels on to the consumer. Below, the trace waterfall adds one span at each step, all under trace ID 4bf92f35: HTTP request and ServiceBusSender.Send in the scanner API, ServiceBusReceiver.Receive and projection write in the consumer.</desc>
<style>
.a{animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.g{transform-box:fill-box;transform-origin:left center}
#c1{animation-name:c1}
#c2{animation-name:c2}
#c3{animation-name:c3}
#t1{animation-name:t1}
#t2{animation-name:t2}
#t3{animation-name:t3}
#t4{animation-name:t4}
#g1{animation-name:g1}
#g2{animation-name:g2}
#g3{animation-name:g3}
#g4{animation-name:g4}
@keyframes c1{0%,3%{transform:translate(-90px,0);opacity:0}5%{transform:translate(-90px,0);opacity:1}12%,100%{transform:translate(0,0);opacity:1}}
@keyframes t1{0%,12%{opacity:0}14%,100%{opacity:1}}
@keyframes g1{0%,12%{transform:scaleX(0)}18%,100%{transform:scaleX(1)}}
@keyframes c2{0%,20%{transform:translate(-110px,0);opacity:0}22%{transform:translate(-110px,0);opacity:1}31%,100%{transform:translate(0,0);opacity:1}}
@keyframes t2{0%,31%{opacity:0}33%,100%{opacity:1}}
@keyframes g2{0%,31%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}
@keyframes c3{0%,38%{transform:translate(-110px,0);opacity:0}40%{transform:translate(-110px,0);opacity:1}49%,100%{transform:translate(0,0);opacity:1}}
@keyframes t3{0%,49%{opacity:0}51%,100%{opacity:1}}
@keyframes g3{0%,49%{transform:scaleX(0)}54%,100%{transform:scaleX(1)}}
@keyframes t4{0%,58%{opacity:0}60%,100%{opacity:1}}
@keyframes g4{0%,58%{transform:scaleX(0)}63%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="690" fill="#F8FAFC"/>

<g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3">
<rect x="40" y="50" width="190" height="160" rx="14"/>
<rect x="452" y="50" width="190" height="160" rx="14"/>
<rect x="1277" y="50" width="190" height="160" rx="14"/>
</g>
<rect x="865" y="50" width="190" height="160" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<rect x="1690" y="50" width="190" height="160" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<g font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">
<text x="135" y="140">scanner</text>
<text x="547" y="140">scanner API</text>
<text x="960" y="140">Service Bus</text>
<text x="1372" y="140">consumer</text>
<text x="1785" y="124">tracking</text>
<text x="1785" y="160">projection</text>
</g>

<g stroke="#334155" stroke-width="3" marker-end="url(#ah)">
<line x1="230" y1="100" x2="450" y2="100"/>
<line x1="642" y1="100" x2="863" y2="100"/>
<line x1="1055" y1="100" x2="1275" y2="100"/>
<line x1="1467" y1="100" x2="1688" y2="100"/>
</g>
<g font-size="26" fill="#64748B" text-anchor="middle">
<text x="341" y="86">HTTP</text>
<text x="753" y="86">send</text>
<text x="1166" y="86">receive</text>
<text x="1578" y="86">write</text>
</g>

<g id="c1" class="a">
<rect x="256" y="118" width="170" height="90" rx="10" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.5"/>
<text x="341" y="156" font-size="26" fill="#0F172A" text-anchor="middle">traceparent</text>
<text x="341" y="192" font-size="26" font-weight="700" fill="#BE185D" text-anchor="middle">4bf92f35</text>
</g>
<g id="c2" class="a">
<rect x="662" y="118" width="184" height="112" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
<path d="M662 122L754 148L846 122" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/>
