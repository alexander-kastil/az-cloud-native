<text x="754" y="218" font-size="26" font-weight="700" fill="#BE185D" text-anchor="middle">4bf92f35</text>
</g>
<g id="c3" class="a">
<rect x="1074" y="118" width="184" height="112" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
<path d="M1074 122L1166 148L1258 122" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/>
<text x="1166" y="186" font-size="26" fill="#0F172A" text-anchor="middle">Diagnostic-Id</text>
<text x="1166" y="218" font-size="26" font-weight="700" fill="#BE185D" text-anchor="middle">4bf92f35</text>
</g>

<rect x="40" y="262" width="1840" height="388" rx="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<rect x="70" y="286" width="250" height="50" rx="10" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.5"/>
<text x="195" y="320" font-size="26" font-weight="700" fill="#BE185D" text-anchor="middle">trace ID 4bf92f35</text>
<g stroke="#94A3B8" stroke-width="1.5">
<line x1="70" y1="416" x2="1850" y2="416"/>
<line x1="70" y1="488" x2="1850" y2="488"/>
<line x1="70" y1="560" x2="1850" y2="560"/>
</g>
<g font-size="26">
<g id="t1" class="a"><text x="70" y="389" fill="#64748B">scanner API</text><text x="270" y="389" fill="#0F172A" font-weight="600">HTTP request</text></g>
<g id="t2" class="a"><text x="70" y="461" fill="#64748B">scanner API</text><text x="270" y="461" fill="#0F172A" font-weight="600">ServiceBusSender.Send</text></g>
<g id="t3" class="a"><text x="70" y="533" fill="#64748B">consumer</text><text x="270" y="533" fill="#0F172A" font-weight="600">ServiceBusReceiver.Receive</text></g>
<g id="t4" class="a"><text x="70" y="605" fill="#64748B">consumer</text><text x="270" y="605" fill="#0F172A" font-weight="600">projection write</text></g>
</g>
<g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5">
<rect id="g1" class="a g" x="640" y="362" width="470" height="36" rx="6"/>
<rect id="g2" class="a g" x="840" y="434" width="210" height="36" rx="6"/>
<rect id="g3" class="a g" x="1150" y="506" width="260" height="36" rx="6"/>
<rect id="g4" class="a g" x="1440" y="578" width="240" height="36" rx="6"/>
</g>
</svg>
