<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 945" width="1920" height="945" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">The same messaging resource on the laptop and in Azure</title>
<desc id="desc">Two lanes with three columns each. On the laptop, aspire run reads AddAzureServiceBus("messaging").RunAsEmulator() in the AppHost and starts the Service Bus emulator container, which runs with a SQL Server companion container. In Azure, the AppHost declares AddAzureServiceBus("messaging") without RunAsEmulator and provisions a Service Bus namespace. On both lanes the resource hands its connection values to shipping-api as environment variables, such as MESSAGING_ENDPOINT, and shipping-api calls AddAzureServiceBusClient(connectionName: "messaging") to get a ServiceBusClient. The service column is identical on both lanes.</desc>
