<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 650" width="1920" height="650" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">The five stages of the standard resilience handler</title>
<desc id="desc">A call from the booking code passes five stages before it reaches shipping-api, from the outermost to the innermost: 1 rate limiter with a permit limit of 1,000 and a queue limit of 0, 2 total timeout of 30 s, 3 retry with at most 3 retries, exponential backoff, jitter and a 2 s delay, 4 circuit breaker with a failure ratio of 10%, a minimum throughput of 100, a sampling duration of 30 s and a break duration of 5 s, 5 attempt timeout of 10 s per attempt. A bracket shows that the total timeout spans all retries, and a loop from the attempt timeout back to the retry stage shows that a failed attempt is retried.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6D28D9"/></marker>
</defs>
<rect width="1920" height="650" fill="#F8FAFC"/>

<text x="1077" y="72" font-size="26" font-weight="600" fill="#6D28D9" text-anchor="middle">the total timeout spans all retries</text>
<path d="M499 112V92H1655V112" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>

<text x="1225" y="170" font-size="26" fill="#0F172A" text-anchor="middle">retry after a failed attempt</text>
<path d="M1522 240V186H928V237" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round" marker-end="url(#ap)"/>

<rect x="30" y="315" width="140" height="140" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<g font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">
<text x="100" y="378">booking</text>
<text x="100" y="414">code</text>
</g>
<rect x="1687" y="330" width="200" height="110" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="1787" y="395" font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">shipping-api</text>

<g fill="#EDE9FE" stroke="#6D28D9" stroke-width="3">
<rect x="202" y="240" width="265" height="290" rx="14"/>
<rect x="499" y="240" width="265" height="290" rx="14"/>
<rect x="796" y="240" width="265" height="290" rx="14"/>
<rect x="1093" y="240" width="265" height="290" rx="14"/>
<rect x="1390" y="240" width="265" height="290" rx="14"/>
</g>
<g fill="#6D28D9">
<circle cx="334.5" cy="282" r="22"/>
<circle cx="631.5" cy="282" r="22"/>
<circle cx="928.5" cy="282" r="22"/>
<circle cx="1225.5" cy="282" r="22"/>
<circle cx="1522.5" cy="282" r="22"/>
</g>
<g font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<text x="334.5" y="291">1</text>
<text x="631.5" y="291">2</text>
<text x="928.5" y="291">3</text>
<text x="1225.5" y="291">4</text>
<text x="1522.5" y="291">5</text>
</g>
<g font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">
<text x="334.5" y="346">Rate limiter</text>
<text x="631.5" y="346">Total timeout</text>
<text x="928.5" y="346">Retry</text>
<text x="1225.5" y="346">Circuit breaker</text>
<text x="1522.5" y="346">Attempt timeout</text>
</g>
<g font-size="26" fill="#0F172A" text-anchor="middle">
<text x="334.5" y="392">permit limit 1,000</text>
<text x="334.5" y="428">queue limit 0</text>
<text x="631.5" y="392">30 s</text>
<text x="928.5" y="392">max 3 retries</text>
<text x="928.5" y="428">exponential backoff</text>
<text x="928.5" y="464">with jitter</text>
<text x="928.5" y="500">delay 2 s</text>
<text x="1225.5" y="392">failure ratio 10%</text>
<text x="1225.5" y="428">min throughput 100</text>
<text x="1225.5" y="464">sampling 30 s</text>
<text x="1225.5" y="500">break 5 s</text>
<text x="1522.5" y="392">10 s</text>
<text x="1522.5" y="428">per attempt</text>
</g>

<g stroke="#334155" stroke-width="3" marker-end="url(#ah)">
<line x1="170" y1="385" x2="200" y2="385"/>
<line x1="467" y1="385" x2="497" y2="385"/>
<line x1="764" y1="385" x2="794" y2="385"/>
<line x1="1061" y1="385" x2="1091" y2="385"/>
<line x1="1358" y1="385" x2="1388" y2="385"/>
<line x1="1655" y1="385" x2="1685" y2="385"/>
</g>

<path d="M202 548V568H1655V548" fill="none" stroke="#64748B" stroke-width="3" stroke-linejoin="round"/>
<text x="928" y="612" font-size="26" fill="#64748B" text-anchor="middle">AddStandardResilienceHandler, from the outermost to the innermost stage</text>
</svg>
