<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 820" width="1920" height="820" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Who opens each connection with push delivery to a storage queue and with pull delivery</title>
<desc id="desc">Two lanes. Push: the partner-delivered subscription of the Event Grid custom topic opens the connection and sends ParcelDelivered into the storage queue partner-delivered, and the partner application calls out of its network to read the queue on its own schedule. Pull: the partner application, on the carrier's own scheduler, calls out of its network to the Event Grid namespace with ReceiveAsync, and the events come back in the response, then calls AcknowledgeAsync to delete the processed events. No inbound port is needed for pull.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="820" fill="#F8FAFC"/>

<g fill="#FFFFFF" stroke="#94A3B8" stroke-width="2">
<rect x="30" y="30" width="1860" height="330" rx="20"/>
<rect x="30" y="390" width="1860" height="400" rx="20"/>
</g>
<text x="60" y="84" font-size="30" font-weight="700" fill="#0F172A">Push<tspan font-size="26" font-weight="400" fill="#64748B" dx="18">Event Grid delivers into a storage queue</tspan></text>
<text x="60" y="444" font-size="30" font-weight="700" fill="#0F172A">Pull<tspan font-size="26" font-weight="400" fill="#64748B" dx="18">the partner calls out</tspan></text>

<g fill="#F8FAFC" stroke="#64748B" stroke-width="3" stroke-dasharray="14 10">
<rect x="1060" y="110" width="800" height="230" rx="18"/>
<rect x="1060" y="470" width="800" height="290" rx="18"/>
</g>
<g font-size="26" fill="#64748B">
<text x="1084" y="150">partner network</text>
<text x="1084" y="510">partner network</text>
</g>

<g fill="#FEF3C7" stroke="#B45309" stroke-width="3">
<rect x="80" y="140" width="420" height="160" rx="14"/>
<rect x="80" y="490" width="420" height="240" rx="14"/>
</g>
<rect x="750" y="150" width="260" height="140" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3">
<rect x="1320" y="150" width="480" height="140" rx="14"/>
<rect x="1320" y="520" width="480" height="200" rx="14"/>
</g>

<g text-anchor="middle">
<text x="290" y="210" font-size="28" font-weight="700" fill="#0F172A">Event Grid custom topic</text>
<text x="290" y="250" font-size="26" fill="#64748B">subscription partner-delivered</text>
<text x="880" y="212" font-size="28" font-weight="700" fill="#0F172A">storage queue</text>
<text x="880" y="252" font-size="26" fill="#64748B">partner-delivered</text>
<text x="1560" y="212" font-size="28" font-weight="700" fill="#0F172A">partner application</text>
<text x="1560" y="252" font-size="26" fill="#64748B">on its own schedule</text>

<text x="290" y="560" font-size="28" font-weight="700" fill="#0F172A">Event Grid namespace</text>
<text x="290" y="602" font-size="26" fill="#0F172A">namespace topic parcel-events</text>
<text x="290" y="640" font-size="26" fill="#0F172A">subscription partner-delivery</text>
<text x="290" y="678" font-size="26" fill="#64748B">queue delivery mode</text>
<text x="1560" y="585" font-size="28" font-weight="700" fill="#0F172A">partner application</text>
<text x="1560" y="627" font-size="26" fill="#0F172A">on the carrier's own scheduler</text>
<text x="1560" y="665" font-size="26" fill="#64748B">calls out when it is ready</text>
</g>

<g stroke="#334155" stroke-width="4" marker-end="url(#ah)">
<line x1="508" y1="220" x2="748" y2="220"/>
<line x1="1312" y1="220" x2="1012" y2="220"/>
<line x1="1312" y1="570" x2="502" y2="570"/>
<line x1="1312" y1="690" x2="502" y2="690"/>
</g>
<g fill="#334155">
<circle cx="508" cy="220" r="9"/>
<circle cx="1312" cy="220" r="9"/>
<circle cx="1312" cy="570" r="9"/>
<circle cx="1312" cy="690" r="9"/>
</g>

<g text-anchor="middle">
<text x="628" y="204" font-size="28" font-weight="600" fill="#0F172A">ParcelDelivered</text>
<text x="1190" y="204" font-size="26" font-weight="600" fill="#0F172A">reads the queue</text>
<text x="810" y="554" font-size="28" font-weight="600" fill="#0F172A">ReceiveAsync</text>
<text x="810" y="608" font-size="26" fill="#64748B">events come back in the response</text>
<text x="810" y="674" font-size="28" font-weight="600" fill="#0F172A">AcknowledgeAsync</text>
<text x="810" y="728" font-size="26" fill="#64748B">deletes the processed events</text>
</g>
</svg>
