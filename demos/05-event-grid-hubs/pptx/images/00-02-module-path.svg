<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">The six topics of the module, from discrete events to telemetry</title>
<desc id="desc">Two rows of numbered topic cards, read left to right. Discrete events with Event Grid, for partners and functions: 01 Custom Topics and Subscriptions, publish ParcelDelivered as a CloudEvent; 02 Filters, Retries, Dead-Letter, keep the events that Event Grid gives up on; 03 Event Grid Namespaces, Pull Delivery, partners pull ParcelDelivered when they are ready. Telemetry with Event Hubs and SignalR, from the vans to the ops console: 04 Partitions and Checkpoints, van positions in order, resume from the checkpoint; 05 Kafka-Compatible Streaming, telematics vendors keep their Kafka clients; 06 SignalR Service, Push to Browsers, van positions on the ops console map.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#F8FAFC"/>
<rect x="30" y="30" width="1860" height="1020" rx="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>

<text x="90" y="110" font-size="30" font-weight="700" fill="#0F172A">Discrete events<tspan font-size="26" font-weight="400" fill="#64748B" dx="18">Event Grid, for partners and functions</tspan></text>
<text x="90" y="590" font-size="30" font-weight="700" fill="#0F172A">Telemetry<tspan font-size="26" font-weight="400" fill="#64748B" dx="18">Event Hubs and SignalR, from the vans to the ops console</tspan></text>

