<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">The states of a pulled event and the operations on its lock token</title>
<desc id="desc">A published ParcelDelivered event is available in the subscription. Receive, ReceiveAsync, locks it for the consumer. Renew lock, RenewLocksAsync, keeps it locked. Acknowledge, AcknowledgeAsync, deletes it for this subscription. Release, ReleaseAsync, makes it available again after 0, 10, 60, 600 or 3600 seconds. Reject, RejectAsync, dead-letters it when a dead-letter destination exists and drops it when none exists. A receive returns up to 100 events and waits 10 to 120 seconds, 60 by default. A lock can be renewed within one hour of the first receive, and each renewal extends it again.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1080" fill="#F8FAFC"/>
<rect x="30" y="30" width="1860" height="1020" rx="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>

<circle cx="90" cy="260" r="18" fill="#334155"/>
<rect x="340" y="200" width="320" height="120" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<rect x="960" y="200" width="320" height="120" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<rect x="1560" y="200" width="300" height="120" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<path d="M1200 580L1240 620L1200 660L1160 620Z" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<rect x="770" y="760" width="360" height="120" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
<rect x="1270" y="760" width="360" height="120" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
<rect x="60" y="715" width="600" height="290" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>

<g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#ah)">
<line x1="110" y1="260" x2="332" y2="260"/>
<line x1="668" y1="260" x2="952" y2="260"/>
<line x1="1288" y1="260" x2="1552" y2="260"/>
<path d="M1060 200V150H1180V192"/>
<path d="M1040 320V430H500V328"/>
<line x1="1200" y1="320" x2="1200" y2="572"/>
<path d="M1160 620H950V752"/>
<path d="M1240 620H1450V752"/>
</g>
<g fill="#334155">
<circle cx="1060" cy="200" r="7"/>
<circle cx="1040" cy="320" r="7"/>
<circle cx="1200" cy="320" r="7"/>
</g>

<g text-anchor="middle">
<text x="231" y="212" font-size="26" font-weight="600" fill="#0F172A">ParcelDelivered</text>
<text x="231" y="244" font-size="26" fill="#64748B">published</text>

<text x="500" y="252" font-size="30" font-weight="700" fill="#0F172A">Available</text>
<text x="500" y="292" font-size="26" fill="#64748B">in the subscription</text>
<text x="1120" y="252" font-size="30" font-weight="700" fill="#0F172A">Locked</text>
<text x="1120" y="292" font-size="26" fill="#64748B">by the consumer</text>
<text x="1710" y="252" font-size="30" font-weight="700" fill="#0F172A">Deleted</text>
<text x="1710" y="292" font-size="26" fill="#64748B">for this subscription</text>
<text x="950" y="830" font-size="30" font-weight="700" fill="#6D28D9">Dead-lettered</text>
<text x="1450" y="830" font-size="30" font-weight="700" fill="#64748B">Dropped</text>

<text x="810" y="242" font-size="28" font-weight="600" fill="#0F172A">Receive</text>
<text x="810" y="298" font-size="26" fill="#64748B">ReceiveAsync</text>
<text x="1420" y="242" font-size="28" font-weight="600" fill="#0F172A">Acknowledge</text>
<text x="1420" y="298" font-size="26" fill="#64748B">AcknowledgeAsync</text>
<text x="1120" y="86" font-size="28" font-weight="600" fill="#0F172A">Renew lock</text>
<text x="1120" y="120" font-size="26" fill="#64748B">RenewLocksAsync</text>
<text x="770" y="472" font-size="28" font-weight="600" fill="#0F172A">Release</text>
<text x="770" y="508" font-size="26" fill="#64748B">ReleaseAsync</text>
<text x="770" y="544" font-size="26" fill="#64748B">after 0, 10, 60, 600 or 3600 s</text>
</g>

<g font-size="26">
<text x="1218" y="442" font-weight="600" font-size="28" fill="#0F172A">Reject</text>
<text x="1218" y="478" fill="#64748B">RejectAsync</text>
<text x="1145" y="604" text-anchor="end" fill="#0F172A">dead-letter destination exists</text>
<text x="1255" y="604" fill="#0F172A">no dead-letter destination</text>
</g>

<g font-size="26" fill="#0F172A">
<text x="90" y="764" font-size="28" font-weight="700">Receive</text>
<text x="90" y="802">up to 100 events per call</text>
<text x="90" y="838">waits 10 to 120 s, 60 s by default</text>
<text x="90" y="898" font-size="28" font-weight="700">Renew lock</text>
<text x="90" y="936">within one hour of the first receive,</text>
<text x="90" y="972">each renewal extends the lock again</text>
</g>
