<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">What Event Grid does with an event after each delivery attempt</title>
<desc id="desc">Event Grid delivers the event. HTTP 200 to 204 means delivered. A webhook 400, 401, 403 or 413, or an Azure resource 400, 403 or 413, is not retried and goes straight to the dead-letter check. Any other failure waits at least 5 minutes for an Azure resource 401 or 404, 2 minutes for 408, 30 seconds for 503 and 10 seconds for any other code, then checks whether the attempts or the time to live are used up: if not, Event Grid delivers again; if so, it goes to the dead-letter check. With a dead-letter container configured the event is dead-lettered, written 5 minutes after the last attempt; without one it is dropped. On probation, an event can be dead-lettered or dropped without a delivery attempt.</desc>
