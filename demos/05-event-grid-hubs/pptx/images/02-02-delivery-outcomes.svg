<g text-anchor="middle">
<text x="220" y="134" font-size="28" font-weight="700" fill="#0F172A">Event Grid delivers</text>
<text x="220" y="172" font-size="28" font-weight="700" fill="#0F172A">the event</text>
<text x="710" y="150" font-size="28" font-weight="700" fill="#0F172A">HTTP 200 to 204?</text>
<text x="1695" y="150" font-size="30" font-weight="700" fill="#15803D">Delivered</text>

<text x="710" y="348" font-size="28" font-weight="700" fill="#0F172A">Webhook 400, 401, 403, 413</text>
<text x="710" y="386" font-size="28" font-weight="700" fill="#0F172A">or Azure resource</text>
<text x="710" y="424" font-size="28" font-weight="700" fill="#0F172A">400, 403, 413?</text>

<text x="1270" y="348" font-size="28" font-weight="700" fill="#0F172A">Dead-letter</text>
<text x="1270" y="386" font-size="28" font-weight="700" fill="#0F172A">container</text>
<text x="1270" y="424" font-size="28" font-weight="700" fill="#0F172A">configured?</text>

<text x="1695" y="342" font-size="30" font-weight="700" fill="#6D28D9">Dead-lettered</text>
<text x="1695" y="380" font-size="26" fill="#0F172A">written 5 minutes</text>
<text x="1695" y="414" font-size="26" fill="#0F172A">after the last attempt</text>
<text x="1695" y="660" font-size="30" font-weight="700" fill="#64748B">Dropped</text>

<text x="710" y="614" font-size="28" font-weight="700" fill="#0F172A">Wait at least</text>
<text x="710" y="660" font-size="26" fill="#0F172A">Azure resource 401 or 404: 5 minutes</text>
<text x="710" y="698" font-size="26" fill="#0F172A">408: 2 minutes</text>
<text x="710" y="736" font-size="26" fill="#0F172A">503: 30 seconds</text>
<text x="710" y="774" font-size="26" fill="#0F172A">any other code: 10 seconds</text>

<text x="1270" y="648" font-size="28" font-weight="700" fill="#0F172A">Attempts or</text>
<text x="1270" y="686" font-size="28" font-weight="700" fill="#0F172A">time to live</text>
<text x="1270" y="724" font-size="28" font-weight="700" fill="#0F172A">used up?</text>

<text x="1505" y="972" font-size="26" fill="#0F172A">On probation, an event can be dead-lettered</text>
<text x="1505" y="1008" font-size="26" fill="#0F172A">or dropped without a delivery attempt</text>
</g>

