<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 820" width="1920" height="820" role="img" aria-labelledby="dl-title dl-desc">
<title id="dl-title">An unreadable label scan bounces until MaxDeliveryCountExceeded, while scan-processor dead-letters it on the first delivery</title>
<desc id="dl-desc">Left: the handler cannot read the label scan P#ck?dUp and abandons it, so the scan goes from the tracking subscription to the handler and back while DeliveryCount climbs from 1 to 10. Then the broker moves it to the dead-letter queue with the reason MaxDeliveryCountExceeded. Right: ProcessScan in scan-processor calls ScanValidator.Validate, the validation fails, and it calls DeadLetterMessageAsync on the first delivery, so the scan reaches the dead-letter queue of the tracking subscription with DeliveryCount 1 and the reason UnreadableLabel.</desc>
