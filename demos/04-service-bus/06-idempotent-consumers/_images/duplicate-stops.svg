    <rect x="520" y="50" width="360" height="120" rx="18" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
    <text x="700" y="102" font-size="30" font-weight="700" text-anchor="middle">parcel-events</text>
    <text x="700" y="144" font-size="26" fill="#64748B" text-anchor="middle">duplicate detection on</text>

    <rect x="940" y="50" width="480" height="120" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
    <text x="1180" y="102" font-size="30" font-weight="700" text-anchor="middle">ProcessScan</text>
    <text x="1180" y="144" font-size="26" fill="#64748B" text-anchor="middle">ParcelScanStore.TryAppendAsync</text>

    <rect x="1460" y="50" width="400" height="120" rx="18" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <text x="1660" y="102" font-size="30" font-weight="700" text-anchor="middle">tracking</text>
    <text x="1660" y="144" font-size="26" fill="#64748B" text-anchor="middle">Cosmos DB container</text>

    <g class="a r2">
      <path d="M40,200 H470 V230 L452,248 H40 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
      <text x="58" y="233" font-size="26" font-weight="700">duplicate 1: producer retry</text>
    </g>
    <g class="a r30">
      <path d="M40,570 H690 V600 L672,618 H40 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
      <text x="58" y="603" font-size="26" font-weight="700">duplicate 2: redelivery after lock expiry</text>
    </g>

    <g class="a r4">
      <line x1="200" y1="300" x2="698" y2="300" stroke="#334155" stroke-width="3" marker-end="url(#ah)"/>
      <text x="450" y="278" font-size="26" text-anchor="middle">send PKG-100482.AtHub.3</text>
    </g>

    <line class="a r11" x1="700" y1="370" x2="472" y2="370" stroke="#334155" stroke-width="3" stroke-dasharray="12 8"/>
    <g class="a r15">
      <path d="M438,356 L466,384 M438,384 L466,356" stroke="#B91C1C" stroke-width="5" stroke-linecap="round" fill="none"/>
      <text x="586" y="348" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="middle">ack lost</text>
