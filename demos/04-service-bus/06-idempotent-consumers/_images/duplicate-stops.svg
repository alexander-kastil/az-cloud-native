    <line x1="1660" y1="170" x2="1660" y2="1150" stroke="#64748B" stroke-width="2" stroke-dasharray="10 8"/>

    <rect x="60" y="50" width="280" height="120" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
