    <rect class="a h2" opacity="0" x="1472" y="977" width="376" height="161" rx="18" fill="none" stroke="#BE185D" stroke-width="4"/>
    <circle class="a t9" opacity="0" cx="1160" cy="1110" r="9" fill="#1D4ED8"/>
  </g>
