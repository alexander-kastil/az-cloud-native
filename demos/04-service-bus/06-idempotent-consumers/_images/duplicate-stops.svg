    @keyframes t9 { 0%, 70% { opacity: 0; transform: translate(0px, 0px); } 70.75% { opacity: 1; } 75% { opacity: 1; transform: translate(-450px, 0px); } 75.75%, 100% { opacity: 0; transform: translate(-450px, 0px); } }
    @keyframes h1 { 0%, 23% { opacity: 0; } 24%, 26.5% { opacity: 1; } 28%, 100% { opacity: 0; } }
    @keyframes h2 { 0%, 64% { opacity: 0; } 65%, 67.5% { opacity: 1; } 69%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
