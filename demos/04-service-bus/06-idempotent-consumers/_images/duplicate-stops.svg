      <text x="1504" y="764" font-size="26">AtHub appended to the</text>
      <text x="1504" y="802" font-size="26">parcel's scans array</text>
    </g>
    <g class="a r47">
      <rect x="1020" y="840" width="320" height="100" rx="14" fill="#FEE2E2" stroke="#B91C1C" stroke-width="3"/>
      <text x="1044" y="882" font-size="28" font-weight="700" fill="#B91C1C">lock expires</text>
      <text x="1044" y="920" font-size="26">before the complete</text>
