    .a { animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .r2 { animation-name: r2; }
    .r4 { animation-name: r4; }
    .r11 { animation-name: r11; }
    .r15 { animation-name: r15; }
    .r18 { animation-name: r18; }
    .r24 { animation-name: r24; }
    .r30 { animation-name: r30; }
    .r32 { animation-name: r32; }
    .r37 { animation-name: r37; }
    .r39 { animation-name: r39; }
    .r43 { animation-name: r43; }
    .r47 { animation-name: r47; }
    .r52 { animation-name: r52; }
    .r55 { animation-name: r55; }
    .r57 { animation-name: r57; }
    .r60 { animation-name: r60; }
