    <g class="a r52">
      <line x1="700" y1="1000" x2="1166" y2="1000" stroke="#334155" stroke-width="3" marker-end="url(#ah)"/>
      <text x="935" y="978" font-size="26" text-anchor="middle">redelivery, same message</text>
    </g>
    <g class="a r55">
      <rect x="80" y="945" width="560" height="110" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5" stroke-dasharray="10 8"/>
      <text x="104" y="990" font-size="28" font-weight="700">the broker checks only sends</text>
      <text x="104" y="1030" font-size="26">so a redelivery reaches the handler</text>
    </g>
    <rect class="a r57" x="1168" y="1000" width="24" height="120" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
    <g class="a r60">
      <line x1="1192" y1="1055" x2="1478" y2="1055" stroke="#334155" stroke-width="3" marker-end="url(#ah)"/>
      <text x="1335" y="1033" font-size="26" text-anchor="middle">same batch again</text>
    </g>
    <g class="a r65">
      <rect x="1480" y="985" width="360" height="145" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
      <text x="1504" y="1028" font-size="28" font-weight="700" fill="#6D28D9">stop 2: 409 Conflict</text>
      <text x="1504" y="1068" font-size="26">marker already exists</text>
      <text x="1504" y="1106" font-size="26">scans keeps one AtHub</text>
    </g>
    <g class="a r70">
      <line x1="1166" y1="1110" x2="702" y2="1110" stroke="#334155" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#ah)"/>
      <text x="935" y="1088" font-size="26" text-anchor="middle">complete as a duplicate</text>
