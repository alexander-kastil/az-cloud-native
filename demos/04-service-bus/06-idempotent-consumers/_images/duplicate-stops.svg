    @keyframes r55 { 0%, 55% { opacity: 0; } 56.5%, 100% { opacity: 1; } }
    @keyframes r57 { 0%, 57% { opacity: 0; } 58.5%, 100% { opacity: 1; } }
    @keyframes r60 { 0%, 60% { opacity: 0; } 61.5%, 100% { opacity: 1; } }
    @keyframes r65 { 0%, 65% { opacity: 0; } 66.5%, 100% { opacity: 1; } }
    @keyframes r70 { 0%, 70% { opacity: 0; } 71.5%, 100% { opacity: 1; } }
