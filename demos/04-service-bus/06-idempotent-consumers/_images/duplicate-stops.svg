<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1190" width="1920" height="1190" role="img" aria-labelledby="title desc">
  <title id="title">Where each duplicate of PKG-100482.AtHub.3 is stopped</title>
  <desc id="desc">The producer sends PKG-100482.AtHub.3 to the parcel-events topic, the ack is lost, and the producer retries with the same MessageId. The broker finds the ID in its 5-minute history and drops the copy. ProcessScan then receives the message, and ParcelScanStore.TryAppendAsync creates the marker and appends AtHub to the scans array of the parcel document in one transactional batch on the tracking container, but the lock expires before the complete. The broker checks only sends, so the redelivery reaches ProcessScan. The same batch hits the existing marker with 409 Conflict, the scans array keeps one AtHub, and ProcessScan completes the message as a duplicate.</desc>
