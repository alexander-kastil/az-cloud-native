    @keyframes t2 { 0%, 11% { opacity: 0; transform: translate(0px, 0px); } 11.75% { opacity: 1; } 15% { opacity: 1; transform: translate(-234px, 0px); } 15.75%, 100% { opacity: 0; transform: translate(-234px, 0px); } }
    @keyframes t3 { 0%, 18% { opacity: 0; transform: translate(0px, 0px); } 18.75% { opacity: 1; } 23% { opacity: 1; transform: translate(478px, 0px); } 24.5%, 100% { opacity: 0; transform: translate(478px, 0px); } }
    @keyframes t4 { 0%, 32% { opacity: 0; transform: translate(0px, 0px); } 32.75% { opacity: 1; } 37% { opacity: 1; transform: translate(444px, 0px); } 37.75%, 100% { opacity: 0; transform: translate(444px, 0px); } }
    @keyframes t5 { 0%, 39% { opacity: 0; transform: translate(0px, 0px); } 39.75% { opacity: 1; } 43% { opacity: 1; transform: translate(268px, 0px); } 43.75%, 100% { opacity: 0; transform: translate(268px, 0px); } }
    @keyframes t7 { 0%, 52% { opacity: 0; transform: translate(0px, 0px); } 52.75% { opacity: 1; } 57% { opacity: 1; transform: translate(444px, 0px); } 57.75%, 100% { opacity: 0; transform: translate(444px, 0px); } }
