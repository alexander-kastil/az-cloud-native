<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="tc-title tc-desc">
  <title id="tc-title">How the scan processor trigger connects to the tracking subscription</title>
  <desc id="tc-desc">The scan-processor Functions app runs in the aca-env Container Apps environment. Its host.json section extensions.serviceBus sets maxConcurrentCalls 8, maxConcurrentSessions 8, prefetchCount 0 and maxAutoLockRenewalDuration 00:05:00; maxConcurrentCalls applies per instance, defaults to 16 and is multiplied by the cores. Its application settings ServiceBusConnection__fullyQualifiedNamespace and ServiceBusConnection__credential set to managedidentity replace the connection string. The app's managed identity holds two roles on the tracking subscription of the parcel-events topic: Azure Service Bus Data Receiver to receive messages, and Azure Service Bus Data Owner for scale decisions, which read runtime properties through the Administration API. Both roles are assigned on the subscription itself.</desc>
  <defs>
    <marker id="tc-ah" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L20,10 L0,20 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#F8FAFC"/>
  <g font-family="'Segoe UI', Inter, Arial, sans-serif" fill="#0F172A">

    <rect x="40" y="100" width="780" height="820" rx="20" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
    <text x="70" y="156" font-size="32" font-weight="700">scan-processor</text>
    <text x="70" y="196" font-size="26" fill="#64748B">Functions app in the aca-env Container Apps environment</text>

    <rect x="70" y="230" width="720" height="330" rx="14" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="100" y="282" font-size="28" font-weight="700">host.json<tspan font-size="26" font-weight="400" fill="#64748B" font-family="Consolas, 'Cascadia Mono', monospace"> extensions.serviceBus</tspan></text>
    <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="26">
      <text x="100" y="338">maxConcurrentCalls: 8</text>
      <text x="100" y="383">maxConcurrentSessions: 8</text>
      <text x="100" y="428">prefetchCount: 0</text>
      <text x="100" y="473">maxAutoLockRenewalDuration: 00:05:00</text>
    </g>
    <text x="100" y="527" font-size="26" fill="#64748B">per instance; default 16, multiplied by the cores</text>

    <rect x="70" y="590" width="720" height="300" rx="14" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="100" y="642" font-size="28" font-weight="700">application settings</text>
    <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="26">
      <text x="100" y="698">ServiceBusConnection__fullyQualifiedNamespace</text>
      <text x="100" y="738" fill="#64748B">&lt;NAMESPACE&gt;.servicebus.windows.net</text>
      <text x="100" y="798">ServiceBusConnection__credential</text>
      <text x="100" y="838" fill="#64748B">managedidentity</text>
    </g>

    <line x1="822" y1="740" x2="866" y2="740" stroke="#334155" stroke-width="3" marker-end="url(#tc-ah)"/>

    <rect x="870" y="640" width="280" height="200" rx="20" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
    <text x="1010" y="712" font-size="30" font-weight="700" text-anchor="middle">managed</text>
    <text x="1010" y="752" font-size="30" font-weight="700" text-anchor="middle">identity</text>
    <text x="1010" y="798" font-size="26" fill="#64748B" text-anchor="middle">of scan-processor</text>

    <line x1="1152" y1="740" x2="1196" y2="740" stroke="#334155" stroke-width="3" marker-end="url(#tc-ah)"/>

    <rect x="1200" y="100" width="680" height="130" rx="20" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
    <text x="1230" y="178" font-size="32" font-weight="700">parcel-events<tspan font-size="26" font-weight="400" fill="#64748B"> topic</tspan></text>

    <line x1="1540" y1="232" x2="1540" y2="296" stroke="#334155" stroke-width="3" marker-end="url(#tc-ah)"/>

    <rect x="1200" y="300" width="680" height="620" rx="20" fill="#FFFFFF" stroke="#B45309" stroke-width="3"/>
    <text x="1230" y="358" font-size="32" font-weight="700">tracking<tspan font-size="26" font-weight="400" fill="#64748B"> subscription</tspan></text>

    <rect x="1230" y="395" width="620" height="150" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
    <text x="1260" y="455" font-size="28" font-weight="700">Azure Service Bus Data Receiver</text>
    <text x="1260" y="500" font-size="26" fill="#64748B">receives messages from the subscription</text>

    <rect x="1230" y="575" width="620" height="170" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
    <text x="1260" y="635" font-size="28" font-weight="700">Azure Service Bus Data Owner</text>
    <text x="1260" y="680" font-size="26" fill="#64748B">scale decisions: runtime properties</text>
    <text x="1260" y="718" font-size="26" fill="#64748B">read through the Administration API</text>

    <text x="1230" y="815" font-size="28" font-weight="600" fill="#15803D">both roles are assigned on</text>
    <text x="1230" y="855" font-size="28" font-weight="600" fill="#15803D">the subscription itself</text>
  </g>
</svg>
