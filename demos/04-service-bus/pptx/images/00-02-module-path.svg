<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="mp-title mp-desc">
  <title id="mp-title">The six topics of the Service Bus module in order</title>
  <desc id="mp-desc">Two rows of three numbered cards read left to right. The first row, routing, triggers and scaling: 01 Topic Subscriptions with SQL and correlation filters, 02 Azure Functions with Service Bus triggers, 03 Competing Consumers with KEDA scale rules. A connector leads from card 03 down to the second row, order, poison messages and duplicates: 04 Sessions for ordered message processing, 05 Dead-Letter Queues for poison messages, 06 Idempotent Consumers with duplicate detection.</desc>
  <defs>
    <marker id="mp-ah" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L20,10 L0,20 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#F8FAFC"/>
  <g font-family="'Segoe UI', Inter, Arial, sans-serif" fill="#0F172A">

    <text x="60" y="140" font-size="30" font-weight="600" fill="#64748B">Routing, triggers and scaling</text>

    <rect x="60" y="170" width="520" height="270" rx="20" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
    <text x="96" y="250" font-size="46" font-weight="700" fill="#1D4ED8">01</text>
    <text x="96" y="330" font-size="34" font-weight="700">Topic Subscriptions</text>
    <text x="96" y="384" font-size="28" fill="#64748B">SQL and correlation filters</text>

    <rect x="700" y="170" width="520" height="270" rx="20" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
    <text x="736" y="250" font-size="46" font-weight="700" fill="#1D4ED8">02</text>
    <text x="736" y="330" font-size="34" font-weight="700">Azure Functions</text>
    <text x="736" y="384" font-size="28" fill="#64748B">Service Bus triggers</text>

    <rect x="1340" y="170" width="520" height="270" rx="20" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
    <text x="1376" y="250" font-size="46" font-weight="700" fill="#1D4ED8">03</text>
    <text x="1376" y="330" font-size="34" font-weight="700">Competing Consumers</text>
    <text x="1376" y="384" font-size="28" fill="#64748B">KEDA scale rules</text>

    <line x1="582" y1="305" x2="696" y2="305" stroke="#334155" stroke-width="3" marker-end="url(#mp-ah)"/>
    <line x1="1222" y1="305" x2="1336" y2="305" stroke="#334155" stroke-width="3" marker-end="url(#mp-ah)"/>

    <path d="M1600,442 V540 H120 V646" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#mp-ah)"/>

    <text x="160" y="620" font-size="30" font-weight="600" fill="#64748B">Order, poison messages and duplicates</text>

    <rect x="60" y="650" width="520" height="270" rx="20" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <text x="96" y="730" font-size="46" font-weight="700" fill="#15803D">04</text>
    <text x="96" y="810" font-size="34" font-weight="700">Sessions</text>
    <text x="96" y="864" font-size="28" fill="#64748B">ordered message processing</text>

    <rect x="700" y="650" width="520" height="270" rx="20" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <text x="736" y="730" font-size="46" font-weight="700" fill="#15803D">05</text>
    <text x="736" y="810" font-size="34" font-weight="700">Dead-Letter Queues</text>
    <text x="736" y="864" font-size="28" fill="#64748B">poison messages</text>

    <rect x="1340" y="650" width="520" height="270" rx="20" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <text x="1376" y="730" font-size="46" font-weight="700" fill="#15803D">06</text>
    <text x="1376" y="810" font-size="34" font-weight="700">Idempotent Consumers</text>
    <text x="1376" y="864" font-size="28" fill="#64748B">duplicate detection</text>

    <line x1="582" y1="785" x2="696" y2="785" stroke="#334155" stroke-width="3" marker-end="url(#mp-ah)"/>
    <line x1="1222" y1="785" x2="1336" y2="785" stroke="#334155" stroke-width="3" marker-end="url(#mp-ah)"/>
  </g>
</svg>
