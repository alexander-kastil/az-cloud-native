<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="ov-title ov-desc">
<title id="ov-title">What runs at the end of the lab, with the step that adds each piece</title>
<desc id="ov-desc">At the start, the AppHost runs on your machine and starts the messaging and cosmos emulators. aspire deploy then fills the resource group rg-azn-labs, and a numbered badge on each piece names the step that adds it. Step 1 adds the Container Apps environment aca-env, the container apps shipping-api and tracking-service with a public endpoint and /health, and the messaging and cosmos resources in Azure. Step 2 adds key-vault, where shipping-api reads carrier-api-key. Step 3 adds config, where tracking-service reads Tracking:PageSize = 50. Step 4 adds app-insights, which receives traces, metrics and logs from both services. Step 5 splits tracking-service traffic, 90% to the v1 revision and 10% to the v2 revision. Step 6 adds booking-trace.kql, a KQL query over app-insights.</desc>
