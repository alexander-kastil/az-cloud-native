<text x="446" y="452">shipments</text>
<text x="1406" y="452">tracking</text>
</g>
<g font-size="26" fill="#64748B">
<text x="446" y="490">Cosmos DB container</text>
<text x="1406" y="490">Cosmos DB container</text>
</g>

<g stroke="#334155" stroke-width="3" marker-end="url(#bt-ah)">
<line x1="320" y1="225" x2="418" y2="225"/>
<line x1="800" y1="225" x2="898" y2="225"/>
<line x1="1280" y1="225" x2="1378" y2="225"/>
<line x1="610" y1="330" x2="610" y2="408"/>
