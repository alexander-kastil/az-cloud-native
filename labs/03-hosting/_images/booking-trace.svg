<text x="60" y="194" font-size="28" font-weight="700" fill="#0F172A">POST /shipments</text>
<g font-size="26" fill="#64748B">
<text x="60" y="238">trackingNumber</text>
<text x="60" y="274">CL-2026-000142</text>
</g>

<g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3">
<rect x="420" y="120" width="380" height="210" rx="14"/>
<rect x="1380" y="120" width="500" height="210" rx="14"/>
</g>
<g font-size="30" font-weight="700" fill="#0F172A">
<text x="446" y="174">shipping-api</text>
<text x="1406" y="174">tracking-service</text>
</g>
<g font-size="26" fill="#64748B">
<text x="446" y="218">BookShipment</text>
<text x="446" y="256">logs the booking</text>
<text x="1406" y="218">ShipmentBookedProcessor</text>
<text x="1406" y="256">ProjectShipmentBooked</text>
</g>

<rect x="900" y="100" width="380" height="250" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<text x="924" y="150" font-size="28" font-weight="700" fill="#0F172A">shipment-events</text>
<text x="924" y="188" font-size="26" fill="#64748B">tracking subscription</text>
<rect x="924" y="216" width="332" height="106" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
<text x="944" y="257" font-size="26" font-weight="600" fill="#0F172A">ShipmentBooked</text>
<text x="944" y="299" font-size="26" font-weight="700" fill="#BE185D">with the OperationId</text>

<g fill="#FEF3C7" stroke="#B45309" stroke-width="3">
<rect x="420" y="410" width="380" height="100" rx="14"/>
<rect x="1380" y="410" width="500" height="100" rx="14"/>
</g>
