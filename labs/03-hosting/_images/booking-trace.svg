<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1120" width="1920" height="1120" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="bt-title bt-desc">
<title id="bt-title">One booking across both services, and the rows booking-trace.kql returns for its OperationId</title>
<desc id="bt-desc">POST /shipments with tracking number CL-2026-000142 reaches shipping-api, which runs BookShipment, writes the shipment to the Cosmos DB container shipments with CreateItemAsync and sends ShipmentBooked to the shipment-events topic. The message carries the OperationId to the tracking subscription, where ShipmentBookedProcessor in tracking-service receives it, runs ProjectShipmentBooked and writes to the Cosmos DB container tracking with UpsertItemAsync. Below, the booking-trace.kql result unions AppRequests, AppDependencies and AppTraces in time order, and every row shares one OperationId, bookingOperationId, taken from the POST row. The shipping-api rows come first: the POST /shipments request, BookShipment, CreateItemAsync, SendMessageAsync and the booking log line. The tracking-service rows follow: the message from ShipmentBookedProcessor, ProjectShipmentBooked and UpsertItemAsync.</desc>
<defs>
<marker id="bt-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="1120" fill="#F8FAFC"/>

