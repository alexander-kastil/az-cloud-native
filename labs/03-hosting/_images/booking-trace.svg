<path d="M1530 696H1556V1054H1530M1556 875H1580" fill="none" stroke="#BE185D" stroke-width="3" stroke-linejoin="round"/>
<text x="1600" y="848" font-size="28" font-weight="700" fill="#BE185D">one OperationId</text>
<g font-size="26" fill="#64748B">
<text x="1600" y="886">bookingOperationId,</text>
