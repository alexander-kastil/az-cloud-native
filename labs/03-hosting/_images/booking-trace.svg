<g font-size="26" fill="#0F172A">
<text x="620" y="723" font-weight="700">POST /shipments</text>
<text x="620" y="769">BookShipment</text>
<text x="620" y="815">CreateItemAsync on shipments</text>
<text x="620" y="861">SendMessageAsync to shipment-events</text>
<text x="620" y="907">Shipment … booked with tracking number CL-2026-000142</text>
<text x="620" y="953">ShipmentBookedProcessor receives ShipmentBooked</text>
<text x="620" y="999">ProjectShipmentBooked</text>
<text x="620" y="1045">UpsertItemAsync on tracking</text>
