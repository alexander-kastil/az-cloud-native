<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 700" width="1920" height="700" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="s4-title s4-desc">
<title id="s4-title">ParcelDeliveredPublisher sends ParcelDelivered as a CloudEvent to egt-contoso-labs05, and the partner-delivered subscription puts it in the partner's queue</title>
<desc id="s4-desc">ParcelDeliveredPublisher in LabelService wraps an EventGridPublisherClient and calls SendEventAsync with a CloudEvent whose source is /label-service, whose type is ParcelDelivered and whose data is the ParcelDelivered record. The custom topic egt-contoso-labs05 accepts the CloudEvents schema. The event subscription partner-delivered passes only ParcelDelivered on to the storage queue partner-delivered in the storage account stcontosolabs05, and the partner reads the queue on its own schedule. The publisher signs in with DefaultAzureCredential as the signed-in user from az login, who holds the role EventGrid Data Sender on egt-contoso-labs05, assigned by provision.azcli.</desc>
