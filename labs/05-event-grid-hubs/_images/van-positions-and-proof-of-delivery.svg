<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1360" width="1920" height="1360" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="ov-title ov-desc">
<title id="ov-title">What runs at the end of lab 5, with the step that adds each piece</title>
<desc id="ov-desc">Two lanes, and a numbered badge marks the step that adds each piece. Van positions, run by Aspire on your laptop: VanSimulator, step 1, is a Kafka producer that uses the VanId as the key. It sends to the event hub van-positions with 4 partitions in the event-hubs emulator, step 1, through the Kafka endpoint on port 9092. telemetry-ingest, step 2, reads the positions with VanPositionProcessor through the consumer group ops-console and writes checkpoints to the blob container ops-console in Azurite, step 2. Its VanPositionHub sends them through Azure SignalR Service sigr-contoso-labs05 in Default mode, step 3, as vanPositionReported to the map panel of the ops console, step 2, which draws one dot per van. Proof of delivery, where the Azure resources come from provision.azcli and LabelService runs with dotnet run: the photo CL-10482.jpg in the blob container proof-of-delivery raises BlobCreated on the system topic egst-pod-labs05, and its subscription pod-uploaded puts it in the storage queue pod-events. ProofOfDeliveryWorker in LabelService, step 5, reads the queue, turns CL-10482.jpg into the tracking number CL-10482 and calls PublishAsync on ParcelDeliveredPublisher, step 4. The publisher sends ParcelDelivered through EventGridPublisherClient to the custom topic egt-contoso-labs05, and its subscription partner-delivered puts the event in the storage queue partner-delivered, which the partner reads on its own schedule.</desc>
