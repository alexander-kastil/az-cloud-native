<rect x="30" y="300" width="1860" height="590" rx="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="60" y="354" font-size="30" font-weight="700" fill="#0F172A">For each message<tspan font-size="26" font-weight="400" fill="#64748B" dx="18">in ProofOfDeliveryWorker, in this order</tspan></text>

<rect x="60" y="400" width="360" height="180" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
<g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3">
