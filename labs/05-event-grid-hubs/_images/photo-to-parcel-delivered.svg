<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 920" width="1920" height="920" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="s5-title s5-desc">
<title id="s5-title">ProofOfDeliveryWorker turns a photo in proof-of-delivery into ParcelDelivered and deletes the queue message only after the publish succeeds</title>
<desc id="s5-desc">The photo CL-10482.jpg in the blob container proof-of-delivery raises BlobCreated on the system topic egst-pod-labs05, and its subscription pod-uploaded puts the event in the storage queue pod-events. ProofOfDeliveryWorker in LabelService reads the queue with ReceiveMessagesAsync and parses each message with CloudEvent.Parse. For each message: when it is BlobCreated in proof-of-delivery, the worker takes the tracking number CL-10482 from CL-10482.jpg and calls PublishAsync, which sends ParcelDelivered for CL-10482 to egt-grey-labs05. When the publish succeeds, DeleteMessageAsync removes the message from pod-events. When the publish fails, the worker does not delete it, and pod-events shows the message again after its one-minute visibility timeout. Any other message is deleted with DeleteMessageAsync and no publish.</desc>
<defs>
<marker id="s5-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="920" fill="#F8FAFC"/>

