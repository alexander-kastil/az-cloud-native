<g font-size="26" fill="#64748B" text-anchor="middle">
<text x="609" y="446">Kafka protocol</text>
<text x="609" y="482">SASL_PLAINTEXT</text>
<text x="609" y="518">mechanism PLAIN</text>
</g>

<rect x="840" y="40" width="1040" height="700" rx="22" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<text x="870" y="96" font-size="30" fill="#0F172A">event hub <tspan font-weight="700">van-positions</tspan><tspan font-size="26" fill="#64748B" dx="18">in the event-hubs emulator</tspan></text>

<rect x="760" y="374" width="160" height="52" rx="26" fill="#FCE7F3" stroke="#BE185D" stroke-width="2"/>
<text x="840" y="409" font-size="26" font-weight="600" fill="#BE185D" text-anchor="middle">port 9092</text>

<g stroke="#334155" stroke-width="3" marker-end="url(#s1-ah)">
