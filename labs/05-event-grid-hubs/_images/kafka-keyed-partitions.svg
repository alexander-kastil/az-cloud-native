<text x="250" y="206" font-size="30" font-weight="700" fill="#0F172A" text-anchor="middle">VanSimulator</text>
<text x="250" y="246" font-size="26" fill="#64748B" text-anchor="middle">Confluent.Kafka producer</text>
<g fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2">
<rect x="70" y="276" width="360" height="100" rx="12"/>
<rect x="70" y="392" width="360" height="100" rx="12"/>
<rect x="70" y="508" width="360" height="100" rx="12"/>
</g>
