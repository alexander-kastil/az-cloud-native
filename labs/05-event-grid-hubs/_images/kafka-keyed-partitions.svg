<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 780" width="1920" height="780" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="s1-title s1-desc">
<title id="s1-title">VanSimulator sends keyed positions over Kafka into the four partitions of van-positions</title>
<desc id="s1-desc">VanSimulator is a Confluent.Kafka producer. It calls ProduceAsync for van-07, van-12 and van-21, with the VanId as the message Key and Sequence 1, 2, 3 for each van. It speaks the Kafka protocol with SASL_PLAINTEXT and PLAIN to port 9092 of the event-hubs emulator. The hashed Key picks the partition of the event hub van-positions, which has partitions 0 to 3. In this example 07-1, 07-2 and 07-3 land in partition 1, the positions of van-12 in partition 2 and those of van-21 in partition 3, and partition 0 stays empty. Each van's positions stay in order within their partition.</desc>
<defs>
<marker id="s1-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="780" fill="#F8FAFC"/>

