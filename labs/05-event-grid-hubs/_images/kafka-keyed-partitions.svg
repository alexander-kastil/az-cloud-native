<text x="94" y="434">Key<tspan dx="12" font-size="28" font-weight="700" fill="#0F172A">van-12</tspan></text>
<text x="94" y="550">Key<tspan dx="12" font-size="28" font-weight="700" fill="#0F172A">van-21</tspan></text>
<text x="94" y="356">Sequence 1, 2, 3</text>
<text x="94" y="472">Sequence 1, 2, 3</text>
<text x="94" y="588">Sequence 1, 2, 3</text>
</g>

<line x1="460" y1="400" x2="758" y2="400" stroke="#334155" stroke-width="4" marker-end="url(#s1-ah)"/>
