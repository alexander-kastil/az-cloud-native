<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 930" width="1920" height="930" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="s2-title s2-desc">
<title id="s2-title">VanPositionProcessor pushes each position first and checkpoints second, so a restart reads the last pushed position again</title>
<desc id="s2-desc">Partition 1 of the event hub van-positions holds the positions 07-1 to 07-8, read through the consumer group ops-console. VanPositionProcessor in telemetry-ingest runs an EventProcessorClient and handles each event in ProcessEventAsync. It first calls SendAsync, which sends vanPositionReported through VanPositionHub at /hubs/van-positions to the map panel of the ops console. Then it calls UpdateCheckpointAsync, which stores the checkpoint in the blob container ops-console in Azurite. The last checkpoint sits after 07-5, and 07-6 was pushed when the process stopped. After a restart the processor reads from the last checkpoint, so 07-6 is read again and can arrive twice at the map. The checkpoint follows the push, so a restart skips no position.</desc>
<defs>
<marker id="s2-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="930" fill="#F8FAFC"/>

