<text x="316" y="390" font-size="26" fill="#64748B">ProcessEventAsync</text>
<g font-size="26" font-weight="600" fill="#0F172A">
<text x="679" y="502" text-anchor="middle">first SendAsync</text>
<text x="1349" y="502" text-anchor="middle">vanPositionReported</text>
<text x="316" y="678">then UpdateCheckpointAsync</text>
</g>

<text x="1240" y="790" font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">The checkpoint follows the push</text>
<text x="1240" y="830" font-size="26" fill="#0F172A" text-anchor="middle">so a restart skips no position, and the last one pushed before the stop can arrive twice</text>
</svg>
