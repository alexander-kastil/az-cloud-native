<text x="1314" y="318" font-size="26" fill="#0F172A" text-anchor="middle">after a restart, 07-6 is read again</text>

<g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3">
<rect x="60" y="420" width="480" height="200" rx="14"/>
