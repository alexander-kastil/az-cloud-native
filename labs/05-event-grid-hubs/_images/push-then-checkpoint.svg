<text x="280" y="210" font-size="28" font-weight="700" fill="#0F172A" text-anchor="end">partition 1</text>
<rect x="300" y="160" width="1550" height="80" rx="12" fill="#F8FAFC" stroke="#B45309" stroke-width="2.5"/>
