<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1455" width="1920" height="1455" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="ov-title ov-desc">
<title id="ov-title">Grey Logistics before step 1 and after step 7, with the step that adds each Dapr piece</title>
<desc id="ov-desc">Before step 1, shipping-api calls Cosmos DB and Service Bus through CosmosClient and ServiceBusClient, and tracking-service calls Cosmos DB, Service Bus and Redis through CosmosClient, ServiceBusClient and IConnectionMultiplexer. After step 7 on the local AppHost, tracking-service, notification-service, shipping-api and routing-service each run with a Dapr sidecar. The sidecars of tracking-service, notification-service and shipping-api load the pubsub and statestore components (step 1), and the routing-service sidecar loads statestore. Step 1 also creates notification-service. tracking-service calls PublishEventAsync to the topic parcel-events through pubsub, and notification-service receives it on POST /parcel-events (step 2). routing-service with POST /reserve-capacity and its sidecar arrive in step 3. shipping-api calls InvokeMethodAsync with the app ID routing-service and the method reserve-capacity (step 4). The component files pubsub-local.yaml with type pubsub.redis and statestore-local.yaml with type state.redis come from step 1, actorStateStore: true from step 6, and resiliency.yaml with shipping-resiliency for routing-service from step 5. VanActor in routing-service comes from step 6. After step 7 on Container Apps, the environment cae-azn-labs-07 in rg-azn-labs holds pubsub with pubsub.azure.servicebus.topics, scoped to tracking-service and notification-service and backed by Service Bus sb-azn-labs-07-grey with the topic parcel-events, and statestore with state.azure.cosmosdb, scoped to routing-service and backed by Cosmos DB cosmos-azn-labs-07-grey, database logistics, container routingstate.</desc>
