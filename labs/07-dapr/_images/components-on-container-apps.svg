<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 840" width="1920" height="840" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="ca-title ca-desc">
<title id="ca-title">Two component files set on cae-azn-labs-07, each scoped to the app IDs that load it</title>
<desc id="ca-desc">components/azure/pubsub.yaml sets componentType pubsub.azure.servicebus.topics, reads the secret servicebus-connection-string through secretRef from its secrets list, and lists the scopes tracking-service and notification-service. components/azure/statestore.yaml sets componentType state.azure.cosmosdb, reads the secret cosmos-master-key through secretRef, and lists the scope routing-service. az containerapp env dapr-component set registers each file on the Container Apps environment cae-azn-labs-07 as the component pubsub or statestore. pubsub is loaded by tracking-service and notification-service and points to Service Bus sb-azn-labs-07-contoso with the topic parcel-events. statestore is loaded by routing-service and points to Cosmos DB cosmos-azn-labs-07-contoso, database logistics, container routingstate. Each example file is copied to its real name and filled in with the values from the Azure portal before the set command runs.</desc>
