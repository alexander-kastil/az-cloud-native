<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1300" width="1920" height="1300" role="img" aria-labelledby="es-title es-desc">
  <title id="es-title">What runs at the end of the lab, with the step that adds each piece</title>
  <desc id="es-desc">At the start, shipping-api handles POST /shipments with CreateItemAsync on the shipments container and a separate SendMessageAsync to shipment-events, and tracking-service reads the tracking container directly. At the end, POST /shipments takes the BookShipment command and returns 202 Accepted (step 7). ShipmentOutboxWriter saves the ShipmentBooked event SHP-10482-v000001 and an outbox document with ttl 864000 in one batch on partition SHP-10482 (step 2). ShipmentEventStore appends later events such as SHP-10482-v000002, a ParcelScanned event, and returns false on 409 (step 1). outbox-relay reads the change feed of shipments and sends to shipment-events, which has duplicate detection on (step 3). tracking-projection reads the same change feed and upserts into the tracking container (step 4), then calls KeyDeleteAsync on the Redis key tracking:&lt;trackingNumber&gt; in the cache (step 6). GET /tracking/{trackingNumber} (step 7) never calls shipping-api. It goes through TrackingCache (step 6), which reads the cache first and reads the tracking container, with its composite index (step 5), only on a miss.</desc>
