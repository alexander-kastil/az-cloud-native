    <rect x="990" y="545" width="340" height="90" rx="14" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="1010" y="581" font-size="28" font-weight="700">ParcelScanStore</text>
    <text x="1010" y="619" font-size="26" fill="#64748B">TryAppendAsync</text>

    <line x1="1458" y1="244" x2="1352" y2="244" stroke="#334155" stroke-width="3" marker-end="url(#sp-ah)"/>
    <rect x="1460" y="160" width="420" height="210" rx="18" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
    <text x="1484" y="210" font-size="30" font-weight="700">scan-backlog</text>
    <text x="1484" y="250" font-size="26" fill="#64748B">KEDA azure-servicebus rule</text>
    <text x="1484" y="292" font-size="26">messageCount 10</text>
