<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">What runs at the end of lab 4, with the step that adds each piece</title>
  <desc id="sp-desc">ParcelScanned, ParcelDelivered and DeliveryDelayed events reach the parcel-events topic, which step 1 adds and step 5 gives duplicate detection with a 5-minute window. Step 1 also adds three subscriptions with Subject filters: tracking gets ParcelScanned, customer-messages gets ParcelDelivered and DeliveryDelayed, and exceptions gets DeliveryDelayed. Step 3 makes tracking require sessions. ProcessScan in the scan-processor app from step 2 receives the tracking messages. ScanValidator from step 4 sends unreadable scans to the tracking dead-letter queue with the reason UnreadableLabel. ParcelScanStore from step 3 appends readable scans to the scans array of the parcel-{trackingNumber} document in the tracking Cosmos DB container, in one batch with the processed-{messageId} marker from step 5. Step 6 runs scan-processor on Container Apps, where the KEDA rule scan-backlog reads the tracking backlog and sets 0 to 10 replicas with messageCount 10.</desc>
  <defs>
    <marker id="sp-ah" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L20,10 L0,20 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="900" fill="#F8FAFC"/>
  <g font-family="'Segoe UI', Inter, Arial, sans-serif" fill="#0F172A">

    <path d="M640,160 V90 H1670 V158" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#sp-ah)"/>
    <text x="1155" y="74" font-size="26" fill="#64748B" text-anchor="middle">backlog</text>

    <rect x="40" y="160" width="310" height="700" rx="18" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
    <text x="64" y="210" font-size="30" font-weight="700">parcel-events</text>
    <text x="64" y="248" font-size="26" fill="#64748B">topic</text>
    <rect x="64" y="290" width="262" height="56" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
    <text x="195" y="327" font-size="26" font-weight="600" text-anchor="middle">ParcelScanned</text>
    <rect x="64" y="380" width="262" height="56" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
    <text x="195" y="417" font-size="26" font-weight="600" text-anchor="middle">ParcelDelivered</text>
    <rect x="64" y="470" width="262" height="56" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
    <text x="195" y="507" font-size="26" font-weight="600" text-anchor="middle">DeliveryDelayed</text>
    <line x1="60" y1="720" x2="330" y2="720" stroke="#B45309" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="64" y="770" font-size="26" font-weight="600">duplicate detection</text>
    <text x="64" y="810" font-size="26" fill="#64748B">5 minutes</text>

    <path d="M352,408 H400 M400,345 V800" fill="none" stroke="#334155" stroke-width="3"/>
