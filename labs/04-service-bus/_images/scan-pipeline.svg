    <line x1="1352" y1="590" x2="1458" y2="590" stroke="#334155" stroke-width="3" marker-end="url(#sp-ah)"/>
    <text x="1405" y="576" font-size="26" fill="#64748B" text-anchor="middle">batch</text>
    <rect x="1460" y="420" width="420" height="440" rx="18" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
    <text x="1484" y="468" font-size="30" font-weight="700">tracking</text>
    <text x="1484" y="506" font-size="26" fill="#64748B">Cosmos DB container</text>
    <rect x="1480" y="530" width="380" height="120" rx="14" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
    <text x="1500" y="578" font-size="26" font-weight="700">parcel-{trackingNumber}</text>
    <text x="1500" y="620" font-size="26" fill="#64748B">scans array</text>
    <rect x="1480" y="680" width="380" height="120" rx="14" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
    <text x="1500" y="728" font-size="26" font-weight="700">processed-{messageId}</text>
    <text x="1500" y="770" font-size="26" fill="#64748B">marker</text>
    <text x="1484" y="840" font-size="26" fill="#64748B">partition key /trackingNumber</text>

    <g font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <circle cx="318" cy="239" r="20" fill="#1D4ED8"/><text x="318" y="248">1</text>
      <circle cx="318" cy="801" r="20" fill="#1D4ED8"/><text x="318" y="810">5</text>
