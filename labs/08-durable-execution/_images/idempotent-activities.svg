<text x="370" y="802" font-size="26" fill="#64748B">ReserveCapacity, CapturePayment, PrintLabel, ReserveCapacity</text>
<rect x="1440" y="740" width="440" height="100" rx="16" fill="#FCE7F3" stroke="#BE185D" stroke-width="3"/>
