<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 880" width="1920" height="880" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="ia8-title ia8-desc">
<title id="ia8-title">Two bookings with the same parcel ID: the ledger check keeps one CapturePayment line</title>
<desc id="ia8-desc">BookingSagaOrchestrator calls ReserveCapacity, CapturePayment and PrintLabel in order. ReserveCapacity has Idempotent =&gt; false and no retry options. CapturePayment has Idempotent =&gt; true and no retry options. PrintLabel has Idempotent =&gt; true and a retry policy with maxNumberOfAttempts 3 and firstRetryInterval 5 s. The first booking finds no line in the ledger, so each of the three activities writes one line to booking-ledger.jsonl in src/BookingWorker/data. The second booking with the same parcel ID writes a second ReserveCapacity line, while CapturePayment and PrintLabel find their line and return without writing. GET /ledger/{parcelId} then returns ReserveCapacity, CapturePayment, PrintLabel, ReserveCapacity, so the parcel has one CapturePayment line.</desc>
<defs>
<marker id="ia8-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="880" fill="#F8FAFC"/>

<g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3">
<rect x="290" y="40" width="340" height="190" rx="14"/>
<rect x="670" y="40" width="340" height="190" rx="14"/>
<rect x="1050" y="40" width="340" height="190" rx="14"/>
</g>
<g font-size="30" font-weight="700" fill="#0F172A">
<text x="314" y="92">ReserveCapacity</text>
<text x="694" y="92">CapturePayment</text>
<text x="1074" y="92">PrintLabel</text>
</g>
<g font-size="26" fill="#334155">
<text x="314" y="136">Idempotent =&gt; false</text>
<text x="314" y="174">without retry options</text>
<text x="694" y="136" font-weight="600" fill="#0F172A">Idempotent =&gt; true</text>
<text x="694" y="174">without retry options</text>
<text x="1074" y="136" font-weight="600" fill="#0F172A">Idempotent =&gt; true</text>
<text x="1074" y="174">maxNumberOfAttempts 3</text>
<text x="1074" y="212">firstRetryInterval 5 s</text>
</g>

<rect x="1440" y="40" width="440" height="660" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="1466" y="92" font-size="28" font-weight="700" fill="#0F172A">booking-ledger.jsonl</text>
<text x="1466" y="130" font-size="26" fill="#64748B">src/BookingWorker/data</text>
<g fill="#DCFCE7" stroke="#15803D" stroke-width="2">
