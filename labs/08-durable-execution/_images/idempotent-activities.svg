<text x="1484" y="435">{parcelId}:PrintLabel</text>
<text x="1484" y="619">{parcelId}:ReserveCapacity</text>
</g>

<g fill="#FFFFFF" stroke="#64748B" stroke-width="2">
<rect x="24" y="260" width="1376" height="210" rx="16"/>
<rect x="24" y="490" width="1376" height="210" rx="16"/>
</g>
<g font-size="28" font-weight="700" fill="#0F172A">
<text x="48" y="352">1st booking</text>
<text x="48" y="582">2nd booking</text>
</g>
<g font-size="26" fill="#64748B">
<text x="48" y="390">POST /bookings</text>
<text x="48" y="620">same parcel ID</text>
</g>

