<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 860" width="1920" height="860" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="bf8-title bf8-desc">
<title id="bf8-title">BookingFunctions on its own: StartBooking, BookingSagaOrchestrator and six activities in one project, connected to the scheduler emulator</title>
<desc id="bf8-desc">A POST to bookings/{parcelId} reaches StartBooking, which has an HttpTrigger on that route and a DurableClient binding of type DurableTaskClient. StartBooking schedules BookingSagaOrchestrator, which has an OrchestrationTrigger, and answers 202 through CreateCheckStatusResponseAsync. The orchestrator calls the six activities in Activities/Activities.cs with CallActivityAsync: ReserveCapacity, CapturePayment and PrintLabel, and the compensations ReleaseCapacity, RefundPayment and VoidLabel, each with an ActivityTrigger. All of them sit in src/BookingFunctions. host.json sets the durableTask extension with hubName %TASKHUB_NAME% and storageProvider type azureManaged, which connects the app to the grpc endpoint of the scheduler emulator and its bookings task hub. Beside it, Azurite is the Storage emulator behind the AzureWebJobsStorage setting.</desc>
