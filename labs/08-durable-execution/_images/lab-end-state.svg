<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1140" width="1920" height="1140" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="ov-title ov-desc">
<title id="ov-title">What runs at the end of lab 8, with the step that adds each piece</title>
<desc id="ov-desc">At the start, the booking runs as plain service calls. At the end, the AppHost in src/AppHost runs the pieces below, and a numbered badge on each piece names the step that adds it. Step 1 adds the scheduler emulator with the bookings task hub, and booking-worker, which is connected to that hub. Step 2 adds BookingSagaOrchestrator with ReserveCapacity, CapturePayment and PrintLabel and their compensations ReleaseCapacity, RefundPayment and VoidLabel, which write data/booking-ledger.jsonl. Step 3 marks CapturePayment and PrintLabel. Step 4 makes booking-worker survive a restart. Step 5 adds DeliveryDeadlineOrchestrator, where CreateTimer leads to RaiseDeliveryDelayed, which publishes through the pubsub Dapr component to the parcel-events topic. Step 6 adds RerouteApproved, which leads to RerouteParcel. Step 7 adds BookingFunctions, started with func start, with StartBooking, its own BookingSagaOrchestrator and six activities. It reaches the scheduler through azureManaged and uses Azurite, the Storage emulator. Step 8 adds the Durable Task analyzer to booking-worker and BookingFunctions. Step 9 runs booking-worker replicas on Container Apps in Azure, scaled by a KEDA scale rule on the bookings task hub of the Durable Task Scheduler.</desc>
