<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 860" width="1920" height="860" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="sw8-title sw8-desc">
<title id="sw8-title">How the AppHost wires the scheduler emulator, the bookings task hub and booking-worker</title>
<desc id="sw8-desc">The AppHost in src/AppHost/Program.cs calls AddDurableTaskScheduler("scheduler").RunAsEmulator() and scheduler.AddTaskHub("bookings"), and adds booking-worker with AddProject and WithReference(bookingsHub). It starts the scheduler, a Durable Task Scheduler emulator that holds the bookings task hub and a dashboard endpoint. It also starts booking-worker with two settings: DURABLE_TASK_SCHEDULER_CONNECTION_STRING set to scheduler.Resource.ConnectionStringExpression, and TASKHUB_NAME set to bookings. In src/BookingWorker/Program.cs, UseDurableTaskScheduler registers the worker, which receives work items from the bookings task hub, and AddDurableTaskClient registers the client, which sends new instances to the hub.</desc>
<defs>
<marker id="sw8-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
