<text x="96" y="159">AddDurableTaskScheduler("scheduler").RunAsEmulator()</text>
<text x="96" y="233">scheduler.AddTaskHub("bookings")</text>
<text x="1104" y="159">AddProject&lt;Projects.BookingWorker&gt;("booking-worker")</text>
<text x="1104" y="233">.WithReference(bookingsHub)</text>
</g>

