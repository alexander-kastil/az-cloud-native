<line x1="760" y1="562" x2="878" y2="562"/>
<line x1="760" y1="686" x2="878" y2="686"/>
<line x1="1360" y1="686" x2="1418" y2="686"/>
<line x1="960" y1="782" x2="960" y2="828"/>
</g>
<text x="976" y="414" font-size="26" fill="#334155">DURABLE warnings</text>
</svg>
