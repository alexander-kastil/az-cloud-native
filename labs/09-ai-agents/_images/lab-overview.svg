<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1130" width="1920" height="1130" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="lov-title lov-desc">
<title id="lov-title">The exception agent and the embedding worker after step 7, with the step that adds each piece</title>
<desc id="lov-desc">On the Service Bus topic parcel-events, DeliveryDelayed reaches the subscription exception-agent with the rule delivery-delayed (step 1). In exception-agent, DelayedParcelWorker (step 1) sends each event to the queue exceptions-urgent when its Priority is urgent and to exceptions-bulk otherwise (step 5). PriorityDispatcher (step 5) takes urgent work first and starts DelayedParcelOrchestration in the task hub exception-tasks (step 3). The orchestration runs ReadProcessedDraft (step 4), DraftCustomerMessage (step 3), SaveRerouteProposal (step 4) and PublishRerouteRequested (step 4). ReadProcessedDraft reads the Cosmos DB container agent-state, and DraftCustomerMessage and SaveRerouteProposal write to it. agent-state holds the item under the event id with the draft and the status processed, and the reroute proposal reroute-&lt;event id&gt; (step 4). DraftCustomerMessage calls the Foundry deployment grey-chat through IChatClient (step 2). PublishRerouteRequested sends RerouteRequested back to parcel-events (step 4). KEDA caps exception-agent at maxReplicas 3 (step 6). The embedding-worker (step 7) reads the change feed of the Cosmos DB container delivery-notes, calls embeddings.create on the Foundry deployment grey-embed, upserts the embedding and the textHash into the note, and finds similar notes with TOP 5 by VectorDistance.</desc>
