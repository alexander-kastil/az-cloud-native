<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 970" width="1920" height="970" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="rcs-title rcs-desc">
<title id="rcs-title">exception-agent-scale.json caps exception-agent at three replicas, with one scale rule per queue</title>
<desc id="rcs-desc">The file exception-agent-scale.json sets minReplicas 0 and maxReplicas 3 and holds two scale rules of type azure-servicebus. The rule urgent-exceptions watches the queue exceptions-urgent and the rule bulk-exceptions watches the queue exceptions-bulk, each with messageCount 1. exceptions-urgent holds one message and exceptions-bulk holds a backlog. Both queues feed exception-agent, which runs at most three replicas. Each replica keeps one model call in flight to the Foundry deployment grey-chat, so at most three calls are in flight. In each replica, PriorityDispatcher keeps one message in flight and receives from exceptions-urgent first, and Program.cs sets Concurrency.MaximumConcurrentActivityWorkItems to 1, so each replica runs one activity, and so one model call, at a time.</desc>
<defs>
<marker id="rcs-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
