<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="dar-title dar-desc">
<title id="dar-title">DelayedParcelOrchestration retries the DraftCustomerMessage activity, which calls grey-chat through IChatClient</title>
<desc id="dar-desc">DelayedParcelWorker, the DeliveryDelayed handler, starts DelayedParcelOrchestration with the event id as the instance id and passes the event id, shipment id and parcel id as input. The orchestration makes no model call. It calls the activity DraftCustomerMessage through CallActivityAsync with TaskOptions.FromRetryPolicy: maxNumberOfAttempts 5, firstRetryInterval 2 s, backoffCoefficient 2 and maxRetryInterval 60 s. DraftCustomerMessage stores nothing. It calls IChatClient.GetResponseAsync with a system message that asks for a short customer notice about a delayed parcel and MaxOutputTokens = 1000, and returns the reply text. The IChatClient comes from AddExceptionAgentChatClient and reaches the Foundry chat deployment grey-chat. In the task hub exception-tasks on the existing scheduler, the first model call returns HTTP 429, the activity is retried after 2 s, the second call returns the draft, and the orchestration completes with it. Attempts 3 to 5 of DraftCustomerMessage would wait 4 s, 8 s and 16 s. The runtime records the draft in the history, so a replay reads it and never calls the model again.</desc>
<defs>
<marker id="dar-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
