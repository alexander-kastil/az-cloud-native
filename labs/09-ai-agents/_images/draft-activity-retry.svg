<text x="655" y="398">maxRetryInterval: 60 s</text>
<text x="1375" y="250">system message: a short customer</text>
<text x="1375" y="286">notice about a delayed parcel</text>
<text x="1375" y="338">MaxOutputTokens = 1000</text>
<text x="1375" y="390">returns the reply text</text>
<text x="1350" y="680">IChatClient from</text>
</g>
