<rect x="790" y="490" width="520" height="100" rx="12"/>
<rect x="790" y="630" width="520" height="100" rx="12"/>
</g>
<g font-size="26" font-weight="700" fill="#0F172A">
<text x="815" y="202">query_items_change_feed</text>
<text x="815" y="342">textHash equals text_hash(text)?</text>
