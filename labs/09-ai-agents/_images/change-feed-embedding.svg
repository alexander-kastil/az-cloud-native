<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="cfe-title cfe-desc">
<title id="cfe-title">embedding-worker embeds each changed delivery note from the change feed, skips its own write-back, and similar_notes runs the vector query</title>
<desc id="cfe-desc">The Cosmos DB container delivery-notes, partition key /parcelId, holds delivery notes with id, parcelId, text, textHash and an embedding of 1,536 numbers. Its vector embedding policy on /embedding uses float32, 1536 dimensions and cosine distance, with a diskANN vector index. The AppHost runs embedding-worker from embedding_worker.py through AddPythonApp, and sets EMBEDDING_DEPLOYMENT to contoso-embed and FOUNDRY_ENDPOINT to the endpoint from Step 2. The worker reads each new or changed note with query_items_change_feed. When the textHash of a note equals text_hash of its text, as after the worker's own upsert, it skips the note. Otherwise it calls embeddings.create with the model EMBEDDING_DEPLOYMENT on the Foundry deployment contoso-embed, which returns 1,536 numbers, and writes the embedding and the new textHash into the note with upsert_item. Each upsert is a change, so the note comes back through the change feed and the hash check skips it. The function similar_notes(container, vector) runs SELECT TOP 5 c.id, c.parcelId, c.text, VectorDistance(c.embedding, @vector) AS score FROM c ORDER BY VectorDistance(c.embedding, @vector) against delivery-notes.</desc>
