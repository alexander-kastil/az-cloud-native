<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 920" width="1920" height="920" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="sp-title sp-desc">
<title id="sp-title">The five projects of ContosoLogistics.sln and their references after Step 1</title>
<desc id="sp-desc">ContosoLogistics.sln holds five projects. The AppHost, src/AppHost/ContosoLogistics.AppHost.csproj on the Aspire.AppHost.Sdk project SDK, has a project reference to ShippingApi and to TrackingService, which become Projects.ShippingApi and Projects.TrackingService in the generated Projects class. ShippingApi and TrackingService are ASP.NET Core web projects, and both reference Contracts, the class library with the namespace Contoso.Contracts that holds one record per event in docs/events.md, such as ShipmentBooked. ServiceDefaults comes from the Aspire service defaults template and nothing references it yet; dashed lines show that both services reference it in Step 2.</desc>
