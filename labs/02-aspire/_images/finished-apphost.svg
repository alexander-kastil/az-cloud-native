<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1190" width="1920" height="1190" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="fa-title fa-desc">
<title id="fa-title">The Grey Logistics AppHost at the end of the lab, each piece numbered with the step that adds it</title>
<desc id="fa-desc">A number badge on each piece names the step that adds it. The AppHost in src/AppHost/Program.cs (1) holds ops-console (6), exception-agent (6), shipping-api (1), tracking-service (1), the messaging Service Bus emulator (3) and the cosmos Cosmos DB emulator (3). verify-booking-trace.py (7) books CL-2026-000142 through POST /shipments (4) on shipping-api. shipping-api saves the shipment to the shipments container and publishes ShipmentBooked to the shipment-events topic. tracking-subscription delivers it to ShipmentBookedProcessor (5) in tracking-service, which writes tracking-container, and GET /tracking/{trackingNumber} (5) reads it. Both services carry ServiceDefaults (2). ops-console sends /api to shipping-api. exception-agent gets the messaging connection through WithReference and does not consume messages yet. Below, one trace titled POST /shipments holds the BookShipment span in shipping-api and, after the Service Bus publish and receive, the ProjectShipmentBooked span in tracking-service.</desc>
