<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 860" width="1920" height="860" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="sb-title sb-desc">
<title id="sb-title">ShipmentBookedProcessor writes the tracking document before it completes the message</title>
<desc id="sb-desc">ShipmentBooked arrives on the shipment-events topic of the messaging Service Bus emulator and waits in the tracking subscription. ShipmentBookedProcessor in tracking-service, a BackgroundService with a ServiceBusProcessor and AutoCompleteMessages = false, receives it and runs four steps in order: 1 deserialize ShipmentBooked, 2 start the ProjectShipmentBooked activity, 3 UpsertItemAsync into the tracking container of the logistics database in the cosmos Cosmos DB emulator, 4 CompleteMessageAsync, which removes the message from the tracking subscription. The tracking document has the id CL-2026-000142 and holds trackingNumber and shipmentId. GET /tracking/{trackingNumber} reads that document and returns 200, or 404 when no document exists.</desc>
<defs>
<marker id="sb-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
