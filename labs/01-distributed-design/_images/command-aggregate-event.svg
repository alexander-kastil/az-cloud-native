<text x="265" y="96">Sent by</text>
<text x="685" y="96">Command</text>
<text x="1155" y="96">Accepted by</text>
<text x="1625" y="96">Emits</text>
</g>

<g fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3">
<rect x="115" y="187" width="300" height="56" rx="28"/>
