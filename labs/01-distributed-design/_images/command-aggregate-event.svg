<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 740" width="1920" height="740" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="ca-title ca-desc">
<title id="ca-title">Each command goes to one aggregate, and the aggregate emits the event</title>
<desc id="ca-desc">Three rows in the columns Sent by, Command, Accepted by and Emits. shipping-api sends BookShipment, the Shipment aggregate accepts it and emits ShipmentBooked. shipping-api sends ReserveCapacity and exception-agent sends RerouteParcel, and the Route aggregate accepts both: it emits CapacityReserved for ReserveCapacity and RerouteApproved for RerouteParcel.</desc>
<defs>
<marker id="ca-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="1920" height="740" fill="#F8FAFC"/>

