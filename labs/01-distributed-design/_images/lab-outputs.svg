<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 840" width="1920" height="840" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img" aria-labelledby="lo-title lo-desc">
<title id="lo-title">What lab 1 produces: two design files, each section marked with the step that adds it</title>
<desc id="lo-desc">docs/events.md holds the Events section from step 1, the Emitted by column from step 2, and the Commands and Aggregates sections from step 2. docs/architecture.md is written from events.md and holds the Bounded Contexts and Service Map sections from step 3, the Flows section from step 4, and the Reliability pattern column and the Saga Compensations section from step 5. Both files go to lab 2, which turns the events into C# records in Grey.Contracts.</desc>
